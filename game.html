<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>匿名猜拳淘汰賽</title>

<style>

body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f5f5f5;
    text-align: center;
    color: #222;
}

.container {
    max-width: 560px;
    margin: auto;
    padding: 25px 18px 60px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 24px;
    margin-top: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,.10);
}

h1 {
    margin-bottom: 5px;
}

.room-number {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 5px;
    margin: 8px;
}

.round {
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
}

.round-state {
    margin-top: 10px;
    font-weight: bold;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 20px;
    margin: 7px;
    font-size: 17px;
    cursor: pointer;
    color: white;
}

.share-btn {
    background: #1687ff;
}

.close-join-btn {
    background: #ff9800;
}

.closed-join-btn {
    background: #888;
    cursor: default;
}

.start-btn {
    background: #06c755;
}

.end-round-btn {
    background: #e53935;
}

.next-btn {
    background: #7b61ff;
}

.choice-area {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
}

.choice {
    width: 95px;
    height: 115px;
    background: white;
    color: #222;
    font-size: 48px;
    box-shadow: 0 3px 12px rgba(0,0,0,.15);
}

.choice:disabled {
    opacity: .3;
    cursor: not-allowed;
}

.player-list {
    text-align: left;
}

.player {
    padding: 12px 5px;
    border-bottom: 1px solid #eee;
}

.spectator {
    color: #999;
}

#hostControls {
    display: none;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #eee;
}

#startRoundBtn,
#endRoundBtn,
#nextRoundBtn {
    display: none;
}

#spectatorMessage {
    display: none;
    padding: 18px;
    margin-top: 15px;
    background: #fafafa;
    border-radius: 12px;
    color: #777;
}

#winnerArea {
    display: none;
}

.winner {
    font-size: 30px;
    font-weight: bold;
    margin: 20px;
}

.host-box {
    padding: 12px;
    background: #fff8e1;
    border-radius: 12px;
    margin-bottom: 15px;
}

.hint {
    font-size: 14px;
    color: #888;
}

#status {
    margin-top: 15px;
    color: #666;
}

#result {
    line-height: 1.8;
    margin-top: 20px;
}


/* =========================
   討論區
========================= */

.chat-card {
    text-align: left;
}

.chat-title {
    text-align: center;
}

#chatMessages {
    height: 300px;
    overflow-y: auto;
    padding: 10px;
    background: #fafafa;
    border-radius: 12px;
    border: 1px solid #eee;
}

.chat-message {
    margin-bottom: 12px;
    padding: 9px 11px;
    background: white;
    border-radius: 10px;
    line-height: 1.5;
    word-break: break-word;
}

.chat-name {
    font-weight: bold;
    font-size: 14px;
}

.chat-text {
    margin-top: 4px;
    font-size: 15px;
}

.chat-input-area {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

#chatInput {
    flex: 1;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 12px;
    font-size: 16px;
    min-width: 0;
}

.chat-send-btn {
    background: #1687ff;
    margin: 0;
    white-space: nowrap;
}

#chatCount {
    text-align: right;
    color: #999;
    font-size: 12px;
    margin-top: 5px;
}

</style>

</head>


<body>

<div class="container">

<h1>
🎮 匿名猜拳淘汰賽
</h1>


<!-- ============================== -->
<!-- 房間資料 -->
<!-- ============================== -->

<div class="card">

<div>
房間號碼
</div>

<div
    id="roomNumber"
    class="room-number"
>
</div>


<div
    id="roundNumber"
    class="round"
>
</div>


<div
    id="roundState"
    class="round-state"
>
🟢 等待參賽者加入
</div>


<button
    class="share-btn"
    onclick="copyInviteLink()"
>

📋 複製邀請連結

</button>


<div id="copyMessage">
</div>


<div id="joinStatus">

🟢 開放加入

</div>

</div>


<!-- ============================== -->
<!-- 玩家名單 -->
<!-- ============================== -->

<div class="card">


<div
    id="hostBox"
    class="host-box"
>
</div>


<h2>
👥 參賽玩家
</h2>


<div
    id="playerList"
    class="player-list"
>
</div>


<div id="status">

等待玩家...

</div>

</div>


<!-- ============================== -->
<!-- 猜拳區 -->
<!-- ============================== -->

<div
    id="gameArea"
    class="card"
>


<h2 id="gameTitle">

🟢 等待其他參賽者加入

</h2>


<div class="choice-area">


<button
    class="choice"
    onclick="choose('rock')"
>

✊

</button>


<button
    class="choice"
    onclick="choose('scissors')"
>

✌️

</button>


<button
    class="choice"
    onclick="choose('paper')"
>

🖐️

</button>


</div>


<div id="spectatorMessage">

👀 你已被淘汰

<br><br>

現在進入觀看模式

</div>


<div id="result">
</div>


<!-- 房主控制 -->

<div id="hostControls">


<div class="hint">

👑 房主控制

</div>


<button
    id="closeJoinBtn"
    class="close-join-btn"
    onclick="closeJoining()"
>

🔒 結束加入

</button>


<button
    id="startRoundBtn"
    class="start-btn"
    onclick="startRound()"
>

▶️ 開始淘汰賽

</button>


<button
    id="endRoundBtn"
    class="end-round-btn"
    onclick="endRound()"
>

🛑 結束本輪

</button>


<button
    id="nextRoundBtn"
    class="next-btn"
    onclick="prepareNextRound()"
>

🔄 準備下一輪

</button>


</div>

</div>


<!-- ============================== -->
<!-- 冠軍 -->
<!-- ============================== -->

<div
    id="winnerArea"
    class="card"
>

<h2>
🎉 比賽結束
</h2>

<div
    id="finalWinner"
    class="winner"
>
</div>

</div>


<!-- ============================== -->
<!-- 討論區 -->
<!-- ============================== -->

<div class="card chat-card">

<h2 class="chat-title">
💬 房間討論區
</h2>

<p
    class="hint"
    style="text-align:center;"
>
房主、參賽者與觀看者都可以聊天
</p>


<div id="chatMessages">

<div
    class="hint"
    style="text-align:center;"
>
尚無訊息
</div>

</div>


<div class="chat-input-area">

<input
    id="chatInput"
    maxlength="100"
    placeholder="輸入訊息..."
>

<button
    class="chat-send-btn"
    onclick="sendMessage()"
>

送出

</button>

</div>


<div id="chatCount">

0 / 100

</div>

</div>


</div>


<script type="module">


import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {

    getFirestore,
    doc,
    onSnapshot,
    runTransaction,
    collection,
    addDoc,
    query,
    orderBy,
    limit,
    serverTimestamp

}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


// ==========================================
// Firebase
// ==========================================

const firebaseConfig = {

    apiKey:
    "AIzaSyBgIL1m6WvO9H23EJ1RUxd_gzAiVnnnWEo",

    authDomain:
    "janken-game-69aa6.firebaseapp.com",

    projectId:
    "janken-game-69aa6",

    storageBucket:
    "janken-game-69aa6.firebasestorage.app",

    messagingSenderId:
    "676529713314",

    appId:
    "1:676529713314:web:3e127ae463d68a250a27fb",

    measurementId:
    "G-BK85KK19FG"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        app
    );


// ==========================================
// 玩家資料
// ==========================================

const playerId =
    sessionStorage
    .getItem(
        "jankenPlayerId"
    );


const nickname =
    sessionStorage
    .getItem(
        "jankenNickname"
    );


const params =
    new URLSearchParams(
        window.location.search
    );


const roomCode =
    params.get(
        "room"
    );


if (
    !playerId ||
    !nickname ||
    !roomCode
) {

    alert(
        "玩家資料不存在，請重新加入遊戲"
    );


    window.location.href =
        "index.html";

}


const roomRef =
    doc(
        db,
        "rooms",
        roomCode
    );


let roomData =
    null;


let isHost =
    false;


// ==========================================
// 房號
// ==========================================

document
.getElementById(
    "roomNumber"
)
.innerText =
    roomCode;


// ==========================================
// 房間即時監聽
// ==========================================

onSnapshot(

    roomRef,

    snapshot => {


        if (
            !snapshot.exists()
        ) {

            return;

        }


        roomData =
            snapshot.data();


        isHost =
            roomData.hostId ===
            playerId;


        const players =
            roomData.players ||
            {};


        document
        .getElementById(
            "hostBox"
        )
        .innerText =
            "👑 房主：" +
            (
                roomData.hostNickname ||
                "主持人"
            );


        renderPlayers(
            players
        );


        updateJoinStatus();


        updateRoundState();


        updateGame(
            players
        );


        updateHostControls(
            players
        );


        document
        .getElementById(
            "roundNumber"
        )
        .innerText =
            "第 " +
            (
                roomData.round ||
                1
            ) +
            " 輪";


        document
        .getElementById(
            "hostControls"
        )
        .style.display =
            isHost
            ? "block"
            : "none";


        if (
            roomData.roundStatus ===
            "ended"
        ) {

            showRoundResult(
                players
            );

        }

        else {

            document
            .getElementById(
                "result"
            )
            .innerHTML =
                "";

        }


        checkFinalWinner(
            players
        );

    }

);


// ==========================================
// 加入狀態
// ==========================================

function updateJoinStatus() {

    const joinOpen =
        roomData.joinOpen !==
        false;


    document
    .getElementById(
        "joinStatus"
    )
    .innerText =
        joinOpen
        ? "🟢 開放加入"
        : "🔒 已停止加入";


    if (!isHost) {

        return;

    }


    const button =
        document
        .getElementById(
            "closeJoinBtn"
        );


    if (
        joinOpen
    ) {

        button.disabled =
            false;


        button.innerText =
            "🔒 結束加入";


        button.className =
            "close-join-btn";

    }

    else {

        button.disabled =
            true;


        button.innerText =
            "🔒 已停止加入";


        button.className =
            "closed-join-btn";

    }

}


// ==========================================
// 輪次文字
// ==========================================

function updateRoundState() {

    const box =
        document
        .getElementById(
            "roundState"
        );


    const round =
        roomData.round ||
        1;


    if (
        roomData.joinOpen !==
        false
    ) {

        box.innerText =
            "🟢 等待參賽者加入";

        return;

    }


    if (
        roomData.roundStatus ===
        "waiting"
    ) {

        if (
            round ===
            1
        ) {

            box.innerText =
                "🔒 報名截止，等待房主開始淘汰賽";

        }

        else {

            box.innerText =
                "⏳ 第 " +
                round +
                " 輪準備中";

        }


        return;

    }


    if (
        roomData.roundStatus ===
        "playing"
    ) {

        if (
            round ===
            1
        ) {

            box.innerText =
                "🔥 淘汰賽開始！第 1 輪";

        }

        else {

            box.innerText =
                "⚔️ 第 " +
                round +
                " 輪進行中";

        }


        return;

    }


    if (
        roomData.roundStatus ===
        "ended"
    ) {

        box.innerText =
            "🏁 第 " +
            round +
            " 輪結束";

    }

}


// ==========================================
// 房主按鈕
// ==========================================

function updateHostControls(
    players
) {

    if (!isHost) {

        return;

    }


    const startBtn =
        document
        .getElementById(
            "startRoundBtn"
        );


    const endBtn =
        document
        .getElementById(
            "endRoundBtn"
        );


    const nextBtn =
        document
        .getElementById(
            "nextRoundBtn"
        );


    startBtn.style.display =
        "none";


    endBtn.style.display =
        "none";


    nextBtn.style.display =
        "none";


    if (
        roomData.joinOpen !==
        false
    ) {

        return;

    }


    if (
        roomData.roundStatus ===
        "waiting"
    ) {

        startBtn.style.display =
            "inline-block";


        if (
            (
                roomData.round ||
                1
            ) ===
            1
        ) {

            startBtn.innerText =
                "▶️ 開始淘汰賽";

        }

        else {

            startBtn.innerText =
                "▶️ 開始本輪";

        }


        return;

    }


    if (
        roomData.roundStatus ===
        "playing"
    ) {

        endBtn.style.display =
            "inline-block";


        return;

    }


    if (
        roomData.roundStatus ===
        "ended"
    ) {

        nextBtn.style.display =
            "inline-block";

    }

}


// ==========================================
// 結束加入
// ==========================================

window.closeJoining =
async function() {

    if (!isHost) {

        return;

    }


    const activeCount =
        Object.values(
            roomData.players ||
            {}
        )
        .filter(
            player =>
                player.status ===
                "active"
        )
        .length;


    if (
        activeCount <
        2
    ) {

        alert(
            "至少需要 2 位參賽玩家才能結束加入"
        );

        return;

    }


    try {

        await runTransaction(

            db,

            async transaction => {


                const snapshot =
                    await transaction.get(
                        roomRef
                    );


                const data =
                    snapshot.data();


                if (
                    data.hostId !==
                    playerId
                ) {

                    throw new Error(
                        "只有房主可以停止加入"
                    );

                }


                transaction.update(

                    roomRef,

                    {

                        joinOpen:
                            false

                    }

                );

            }

        );

    }

    catch(error) {

        alert(
            error.message
        );

    }

};


// ==========================================
// 開始淘汰賽 / 開始本輪
// ==========================================

window.startRound =
async function() {

    if (!isHost) {

        return;

    }


    try {

        await runTransaction(

            db,

            async transaction => {


                const snapshot =
                    await transaction.get(
                        roomRef
                    );


                const data =
                    snapshot.data();


                if (
                    data.hostId !==
                    playerId
                ) {

                    throw new Error(
                        "只有房主可以開始本輪"
                    );

                }


                if (
                    data.joinOpen !==
                    false
                ) {

                    throw new Error(
                        "請先結束加入"
                    );

                }


                if (
                    data.roundStatus !==
                    "waiting"
                ) {

                    throw new Error(
                        "目前不能開始本輪"
                    );

                }


                const activePlayers =
                    Object.values(
                        data.players ||
                        {}
                    )
                    .filter(
                        player =>
                            player.status ===
                            "active"
                    );


                if (
                    activePlayers.length <
                    2
                ) {

                    throw new Error(
                        "至少需要 2 位參賽玩家"
                    );

                }


                transaction.update(

                    roomRef,

                    {

                        roundStatus:
                            "playing"

                    }

                );

            }

        );

    }

    catch(error) {

        alert(
            error.message
        );

    }

};


// ==========================================
// 玩家名單
// ==========================================

function renderPlayers(
    players
) {

    const list =
        document
        .getElementById(
            "playerList"
        );


    list.innerHTML =
        "";


    const entries =
        Object.entries(
            players
        );


    if (
        entries.length ===
        0
    ) {

        list.innerHTML =
            "<div class='player'>目前還沒有參賽玩家</div>";


        return;

    }


    entries.forEach(

        (
            [
                id,
                player
            ]
        ) => {


            const row =
                document
                .createElement(
                    "div"
                );


            row.className =
                "player";


            let text =
                player.nickname;


            if (
                id ===
                playerId
            ) {

                text +=
                    "（你）";

            }


            if (
                player.status ===
                "spectator"
            ) {

                row.classList.add(
                    "spectator"
                );


                text +=
                    "　👀 觀看中";

            }

            else {

                if (
                    roomData.roundStatus ===
                    "playing"
                ) {

                    text +=
                        player.ready
                        ? "　✅ 已出拳"
                        : "　⏳ 尚未出拳";

                }

                else {

                    text +=
                        "　🎮 等待本輪";

                }

            }


            row.innerText =
                text;


            list.appendChild(
                row
            );

        }

    );

}


// ==========================================
// 玩家畫面
// ==========================================

function updateGame(
    players
) {

    const choiceArea =
        document
        .querySelector(
            ".choice-area"
        );


    if (
        isHost
    ) {

        choiceArea.style.display =
            "none";


        document
        .getElementById(
            "gameTitle"
        )
        .innerText =
            "👑 房主主持模式";


        document
        .getElementById(
            "spectatorMessage"
        )
        .style.display =
            "none";

    }

    else {

        const me =
            players[
                playerId
            ];


        if (!me) {

            choiceArea.style.display =
                "none";


            return;

        }


        choiceArea.style.display =
            "flex";


        const buttons =
            document
            .querySelectorAll(
                ".choice"
            );


        if (
            me.status ===
            "spectator"
        ) {

            document
            .getElementById(
                "gameTitle"
            )
            .innerText =
                "👀 觀看模式";


            buttons.forEach(
                button =>
                    button.disabled =
                        true
            );


            document
            .getElementById(
                "spectatorMessage"
            )
            .style.display =
                "block";

        }

        else {

            document
            .getElementById(
                "spectatorMessage"
            )
            .style.display =
                "none";


            const round =
                roomData.round ||
                1;


            if (
                roomData.roundStatus ===
                "waiting"
            ) {

                if (
                    roomData.joinOpen !==
                    false
                ) {

                    document
                    .getElementById(
                        "gameTitle"
                    )
                    .innerText =
                        "🟢 等待其他參賽者加入";

                }

                else if (
                    round ===
                    1
                ) {

                    document
                    .getElementById(
                        "gameTitle"
                    )
                    .innerText =
                        "⏳ 等待房主開始淘汰賽";

                }

                else {

                    document
                    .getElementById(
                        "gameTitle"
                    )
                    .innerText =
                        "⏳ 等待房主開始第 " +
                        round +
                        " 輪";

                }

            }

            else if (
                roomData.roundStatus ===
                "playing"
            ) {

                document
                .getElementById(
                    "gameTitle"
                )
                .innerText =
                    me.ready
                    ? "✅ 你已出拳"
                    : "請選擇你的出拳";

            }

            else {

                document
                .getElementById(
                    "gameTitle"
                )
                .innerText =
                    "🏁 本輪已結束";

            }


            buttons.forEach(
                button => {

                    button.disabled =
                        me.ready ||
                        roomData.roundStatus !==
                        "playing";

                }
            );

        }

    }


    const activePlayers =
        Object.values(
            players
        )
        .filter(
            player =>
                player.status ===
                "active"
        );


    const readyPlayers =
        activePlayers
        .filter(
            player =>
                player.ready
        );


    if (
        roomData.roundStatus ===
        "playing"
    ) {

        document
        .getElementById(
            "status"
        )
        .innerText =
            "本輪已有 " +
            readyPlayers.length +
            " / " +
            activePlayers.length +
            " 位參賽者出拳";

    }

    else {

        document
        .getElementById(
            "status"
        )
        .innerText =
            "目前共有 " +
            activePlayers.length +
            " 位參賽者";

    }

}


// ==========================================
// 玩家出拳
// ==========================================

window.choose =
async function(
    choice
) {

    if (
        isHost
    ) {

        return;

    }


    try {

        await runTransaction(

            db,

            async transaction => {


                const snapshot =
                    await transaction.get(
                        roomRef
                    );


                const data =
                    snapshot.data();


                if (
                    data.roundStatus !==
                    "playing"
                ) {

                    throw new Error(
                        "本輪尚未開始"
                    );

                }


                const players = {

                    ...(
                        data.players ||
                        {}
                    )

                };


                const me =
                    players[
                        playerId
                    ];


                if (
                    !me ||
                    me.status !==
                    "active"
                ) {

                    throw new Error(
                        "你目前不能參賽"
                    );

                }


                if (
                    me.ready
                ) {

                    return;

                }


                players[
                    playerId
                ] = {

                    ...me,

                    choice:
                        choice,

                    ready:
                        true

                };


                transaction.update(

                    roomRef,

                    {

                        players:
                            players

                    }

                );

            }

        );

    }

    catch(error) {

        alert(
            error.message
        );

    }

};


// ==========================================
// 結束本輪
// ==========================================

window.endRound =
async function() {

    if (!isHost) {

        return;

    }


    try {

        await runTransaction(

            db,

            async transaction => {


                const snapshot =
                    await transaction.get(
                        roomRef
                    );


                const data =
                    snapshot.data();


                if (
                    data.roundStatus !==
                    "playing"
                ) {

                    throw new Error(
                        "本輪尚未開始"
                    );

                }


                const players = {

                    ...(
                        data.players ||
                        {}
                    )

                };


                const participants =
                    Object.entries(
                        players
                    )
                    .filter(
                        (
                            [
                                id,
                                player
                            ]
                        ) =>
                            player.status ===
                            "active" &&
                            player.ready
                    );


                if (
                    participants.length <
                    2
                ) {

                    throw new Error(
                        "至少需要 2 位參賽者出拳"
                    );

                }


                const choices =
                    [
                        ...new Set(

                            participants
                            .map(
                                (
                                    [
                                        id,
                                        player
                                    ]
                                ) =>
                                    player.choice
                            )

                        )
                    ];


                // 兩種拳才會產生輸贏
                if (
                    choices.length ===
                    2
                ) {

                    let winningChoice;


                    if (
                        choices.includes(
                            "rock"
                        ) &&
                        choices.includes(
                            "scissors"
                        )
                    ) {

                        winningChoice =
                            "rock";

                    }


                    else if (
                        choices.includes(
                            "scissors"
                        ) &&
                        choices.includes(
                            "paper"
                        )
                    ) {

                        winningChoice =
                            "scissors";

                    }


                    else {

                        winningChoice =
                            "paper";

                    }


                    participants
                    .forEach(
                        (
                            [
                                id,
                                player
                            ]
                        ) => {


                            if (
                                player.choice !==
                                winningChoice
                            ) {

                                players[
                                    id
                                ] = {

                                    ...player,

                                    status:
                                        "spectator"

                                };

                            }

                        }
                    );

                }


                transaction.update(

                    roomRef,

                    {

                        players:
                            players,

                        roundStatus:
                            "ended"

                    }

                );

            }

        );

    }

    catch(error) {

        alert(
            error.message
        );

    }

};


// ==========================================
// 顯示本輪結果
// ==========================================

function showRoundResult(
    players
) {

    const emoji = {

        rock:
            "✊ 石頭",

        scissors:
            "✌️ 剪刀",

        paper:
            "🖐️ 布"

    };


    let html =
        "<h3>🎊 本輪結果</h3>";


    Object.values(
        players
    )
    .forEach(
        player => {


            if (
                player.choice
            ) {

                html +=
                    escapeHtml(
                        player.nickname
                    ) +
                    "：" +
                    emoji[
                        player.choice
                    ];


                if (
                    player.status ===
                    "spectator"
                ) {

                    html +=
                        "　❌ 淘汰";

                }

                else {

                    html +=
                        "　✅ 晉級";

                }


                html +=
                    "<br>";

            }

        }

    );


    document
    .getElementById(
        "result"
    )
    .innerHTML =
        html;

}


// ==========================================
// 準備下一輪
// ==========================================

window.prepareNextRound =
async function() {

    if (!isHost) {

        return;

    }


    try {

        await runTransaction(

            db,

            async transaction => {


                const snapshot =
                    await transaction.get(
                        roomRef
                    );


                const data =
                    snapshot.data();


                if (
                    data.roundStatus !==
                    "ended"
                ) {

                    throw new Error(
                        "本輪尚未結束"
                    );

                }


                const players = {

                    ...(
                        data.players ||
                        {}
                    )

                };


                Object.keys(
                    players
                )
                .forEach(
                    id => {


                        players[
                            id
                        ] = {

                            ...players[
                                id
                            ],

                            choice:
                                null,

                            ready:
                                false

                        };

                    }

                );


                transaction.update(

                    roomRef,

                    {

                        players:
                            players,

                        round:
                            (
                                data.round ||
                                1
                            ) + 1,

                        roundStatus:
                            "waiting"

                    }

                );

            }

        );

    }

    catch(error) {

        alert(
            error.message
        );

    }

};


// ==========================================
// 最終冠軍
// ==========================================

function checkFinalWinner(
    players
) {

    const active =
        Object.values(
            players
        )
        .filter(
            player =>
                player.status ===
                "active"
        );


    if (
        active.length ===
        1 &&
        Object.keys(
            players
        ).length >
        1
    ) {

        document
        .getElementById(
            "winnerArea"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "finalWinner"
        )
        .innerText =
            "🏆 " +
            active[
                0
            ].nickname +
            " 獲勝！";


        document
        .querySelectorAll(
            ".choice"
        )
        .forEach(
            button =>
                button.disabled =
                    true
        );


        if (
            isHost
        ) {

            document
            .getElementById(
                "startRoundBtn"
            )
            .style.display =
                "none";


            document
            .getElementById(
                "endRoundBtn"
            )
            .style.display =
                "none";


            document
            .getElementById(
                "nextRoundBtn"
            )
            .style.display =
                "none";

        }

    }

    else {

        document
        .getElementById(
            "winnerArea"
        )
        .style.display =
            "none";

    }

}

// =====================================================
// 💬 討論區
// =====================================================

const chatRef =
    collection(
        db,
        "rooms",
        roomCode,
        "messages"
    );


const chatQuery =
    query(

        chatRef,

        orderBy(
            "createdAt",
            "desc"
        ),

        limit(
            50
        )

    );


// ==========================================
// 即時取得最近 50 則
// ==========================================

onSnapshot(

    chatQuery,

    snapshot => {


        const messages = [];


        snapshot
        .forEach(
            messageDoc => {

                messages.push(
                    messageDoc.data()
                );

            }
        );


        // 因為資料庫抓最新到最舊，
        // 顯示時反過來變成舊到新
        messages.reverse();


        renderMessages(
            messages
        );

    },

    error => {

        console.error(
            "聊天監聽失敗",
            error
        );

    }

);


// ==========================================
// 顯示訊息
// ==========================================

function renderMessages(
    messages
) {

    const box =
        document
        .getElementById(
            "chatMessages"
        );


    box.innerHTML =
        "";


    if (
        messages.length ===
        0
    ) {

        box.innerHTML =
            "<div class='hint' style='text-align:center;'>尚無訊息</div>";


        return;

    }


    messages
    .forEach(
        message => {


            const wrapper =
                document
                .createElement(
                    "div"
                );


            wrapper.className =
                "chat-message";


            const name =
                document
                .createElement(
                    "div"
                );


            name.className =
                "chat-name";


            if (
                message.role ===
                "host"
            ) {

                name.innerText =
                    "👑 " +
                    (
                        message.nickname ||
                        "房主"
                    );

            }

            else {

                name.innerText =
                    message.nickname ||
                    "匿名玩家";

            }


            const text =
                document
                .createElement(
                    "div"
                );


            text.className =
                "chat-text";


            text.innerText =
                message.text ||
                "";


            wrapper
            .appendChild(
                name
            );


            wrapper
            .appendChild(
                text
            );


            box
            .appendChild(
                wrapper
            );

        }

    );


    box.scrollTop =
        box.scrollHeight;

}


// ==========================================
// 送出訊息
// ==========================================

window.sendMessage =
async function() {

    const input =
        document
        .getElementById(
            "chatInput"
        );


    const text =
        input.value
        .trim();


    if (!text) {

        return;

    }


    if (
        text.length >
        100
    ) {

        alert(
            "訊息最多 100 個字"
        );


        return;

    }


    try {

        await addDoc(

            chatRef,

            {

                playerId:
                    playerId,

                nickname:
                    nickname,

                role:
                    isHost
                    ? "host"
                    : "player",

                text:
                    text,

                createdAt:
                    serverTimestamp()

            }

        );


        input.value =
            "";


        updateChatCount();

    }

    catch(error) {

        console.error(
            error
        );


        alert(
            "訊息送出失敗：" +
            error.message
        );

    }

};


// ==========================================
// Enter 送訊息
// ==========================================

document
.getElementById(
    "chatInput"
)
.addEventListener(
    "keydown",

    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();


            window
            .sendMessage();

        }

    }
);


// ==========================================
// 字數顯示
// ==========================================

function updateChatCount() {

    const input =
        document
        .getElementById(
            "chatInput"
        );


    document
    .getElementById(
        "chatCount"
    )
    .innerText =
        input.value.length +
        " / 100";

}


document
.getElementById(
    "chatInput"
)
.addEventListener(
    "input",
    updateChatCount
);


// ==========================================
// 防 HTML
// ==========================================

function escapeHtml(
    text
) {

    const div =
        document
        .createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}
