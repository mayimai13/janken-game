<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE 多人猜拳</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            margin-top: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        #userInfo {
            color: #555;
            margin-top: 10px;
        }

        input {
            width: 80%;
            max-width: 260px;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .normal-btn {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
            background: #06c755;
            color: white;
        }

        .secondary-btn {
            background: #555;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .choice {
            width: 95px;
            height: 115px;
            border: none;
            border-radius: 18px;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            font-size: 48px;
            cursor: pointer;
        }

        .choice:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #roomArea,
        #gameArea {
            display: none;
        }

        #roomCodeDisplay {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
            margin: 10px 0;
        }

        #playerList {
            text-align: left;
            margin-top: 20px;
        }

        .player-row {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        #status {
            margin-top: 15px;
            color: #666;
            font-size: 15px;
        }

        #result {
            margin-top: 22px;
            font-size: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎮 LINE 多人猜拳</h1>

    <div id="userInfo">
        正在連接 LINE...
    </div>


    <!-- 房間首頁 -->
    <div id="lobbyArea" class="card">

        <h2>開始遊戲</h2>

        <button class="normal-btn" onclick="createRoom()">
            建立房間
        </button>

        <hr style="margin:25px 0; border:none; border-top:1px solid #eee;">

        <div>
            <input
                id="roomInput"
                type="text"
                maxlength="4"
                placeholder="輸入 4 位房號"
                inputmode="numeric"
            >
        </div>

        <button class="normal-btn secondary-btn" onclick="joinRoom()">
            加入房間
        </button>

    </div>


    <!-- 房間畫面 -->
    <div id="roomArea" class="card">

        <div>房間號碼</div>

        <div id="roomCodeDisplay"></div>

        <div id="playerList"></div>

        <div id="status">
            等待玩家...
        </div>

    </div>


    <!-- 出拳區 -->
    <div id="gameArea" class="card">

        <h2>請選擇你的出拳</h2>

        <div class="choices">

            <button class="choice" onclick="choose('rock')">
                ✊
            </button>

            <button class="choice" onclick="choose('scissors')">
                ✌️
            </button>

            <button class="choice" onclick="choose('paper')">
                🖐️
            </button>

        </div>

        <div id="result"></div>

    </div>

</div>


<!-- LINE LIFF -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
        updateDoc,
        onSnapshot,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    const firebaseConfig = {

        apiKey:
        "AIzaSyBgIL1m6WvO9H23EJ1RUxd_gzAiVnnnWEo",

        authDomain:
        "janken-game-69aa6.firebaseapp.com",

        projectId:
        "janken-game-69aa6",

        storageBucket:
        "janken-game-69aa6.firebasestorage.app",

        messagingSenderId:
        "676529713314",

        appId:
        "1:676529713314:web:3e127ae463d68a250a27fb",

        measurementId:
        "G-BK85KK19FG"

    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    let currentUser = null;
    let currentRoom = null;
    let unsubscribeRoom = null;


    // ============================
    // LINE 初始化
    // ============================

    async function initializeLiff() {

        try {

            await liff.init({
                liffId: "2011114180-glOZVk21"
            });

            if (!liff.isLoggedIn()) {

                liff.login();
                return;

            }

            currentUser = await liff.getProfile();

            document.getElementById("userInfo").innerText =
                "👋 " + currentUser.displayName;

        } catch (error) {

            document.getElementById("userInfo").innerText =
                "❌ LINE 連線失敗";

            console.error(error);

        }

    }


    // ============================
    // 產生房號
    // ============================

    function generateRoomCode() {

        return Math.floor(
            1000 + Math.random() * 9000
        ).toString();

    }


    // ============================
    // 建立房間
    // ============================

    window.createRoom = async function() {

        if (!currentUser) {
            alert("LINE 尚未連線完成");
            return;
        }

        let roomCode = generateRoomCode();

        let roomRef = doc(db, "rooms", roomCode);

        let roomSnap = await getDoc(roomRef);


        while (roomSnap.exists()) {

            roomCode = generateRoomCode();

            roomRef = doc(db, "rooms", roomCode);

            roomSnap = await getDoc(roomRef);

        }


        await setDoc(roomRef, {

            createdAt: serverTimestamp(),

            hostId: currentUser.userId,

            status: "waiting",

            players: {

                [currentUser.userId]: {

                    displayName:
                        currentUser.displayName,

                    choice: null,

                    ready: false

                }

            }

        });


        enterRoom(roomCode);

    };


    // ============================
    // 加入房間
    // ============================

    window.joinRoom = async function() {

        if (!currentUser) {
            alert("LINE 尚未連線完成");
            return;
        }

        const roomCode =
            document.getElementById("roomInput")
            .value.trim();


        if (roomCode.length !== 4) {

            alert("請輸入 4 位房號");
            return;

        }


        const roomRef =
            doc(db, "rooms", roomCode);


        const roomSnap =
            await getDoc(roomRef);


        if (!roomSnap.exists()) {

            alert("找不到這個房間");
            return;

        }


        const data =
            roomSnap.data();


        const players =
            data.players || {};


        players[currentUser.userId] = {

            displayName:
                currentUser.displayName,

            choice:
                players[currentUser.userId]?.choice || null,

            ready:
                players[currentUser.userId]?.ready || false

        };


        await updateDoc(roomRef, {
            players: players
        });


        enterRoom(roomCode);

    };


    // ============================
    // 進入房間
    // ============================

    function enterRoom(roomCode) {

        currentRoom = roomCode;

        document.getElementById("lobbyArea").style.display =
            "none";

        document.getElementById("roomArea").style.display =
            "block";

        document.getElementById("gameArea").style.display =
            "block";

        document.getElementById("roomCodeDisplay").innerText =
            roomCode;


        listenRoom(roomCode);

    }


    // ============================
    // 即時監聽房間
    // ============================

    function listenRoom(roomCode) {

        if (unsubscribeRoom) {
            unsubscribeRoom();
        }


        const roomRef =
            doc(db, "rooms", roomCode);


        unsubscribeRoom =
        onSnapshot(roomRef, (snapshot) => {

            if (!snapshot.exists()) {
                return;
            }


            const data =
                snapshot.data();


            const players =
                data.players || {};


            renderPlayers(players);

            checkResult(players);

        });

    }


    // ============================
    // 顯示玩家
    // ============================

    function renderPlayers(players) {

        const list =
            document.getElementById("playerList");

        list.innerHTML = "";


        Object.values(players).forEach(player => {

            const row =
                document.createElement("div");

            row.className =
                "player-row";


            row.innerText =
                player.displayName +
                "　" +
                (
                    player.ready
                    ? "✅ 已出拳"
                    : "⏳ 尚未出拳"
                );


            list.appendChild(row);

        });

    }


    // ============================
    // 出拳
    // ============================

    window.choose = async function(choice) {

        if (!currentRoom || !currentUser) {
            return;
        }


        const roomRef =
            doc(db, "rooms", currentRoom);


        const roomSnap =
            await getDoc(roomRef);


        if (!roomSnap.exists()) {
            return;
        }


        const data =
            roomSnap.data();


        const players =
            data.players || {};


        players[currentUser.userId] = {

            displayName:
                currentUser.displayName,

            choice:
                choice,

            ready:
                true

        };


        await updateDoc(roomRef, {
            players: players
        });


        document.getElementById("status").innerText =
            "✅ 你已經出拳，等待其他玩家";


        document
        .querySelectorAll(".choice")
        .forEach(button => {

            button.disabled = true;

        });

    };


    // ============================
    // 判斷結果
    // ============================

    function checkResult(players) {

        const playerArray =
            Object.values(players);


        if (playerArray.length < 2) {

            document.getElementById("status").innerText =
                "等待其他玩家加入...";

            return;

        }


        const allReady =
            playerArray.every(
                player => player.ready
            );


        if (!allReady) {

            document.getElementById("status").innerText =
                "等待所有玩家出拳...";

            return;

        }


        showResult(playerArray);

    }


    // ============================
    // 公布結果
    // ============================

    function showResult(players) {

        const resultBox =
            document.getElementById("result");


        const emoji = {

            rock: "✊ 石頭",

            scissors: "✌️ 剪刀",

            paper: "🖐️ 布"

        };


        let html =
            "<h3>🎊 全員完成</h3>";


        players.forEach(player => {

            html +=
                player.displayName +
                "： " +
                emoji[player.choice] +
                "<br>";

        });


        const choices =
            [...new Set(
                players.map(
                    player => player.choice
                )
            )];


        if (
            choices.length === 1 ||
            choices.length === 3
        ) {

            html +=
                "<br><strong>🤝 平手！</strong>";

        } else {


            let winningChoice = "";


            if (
                choices.includes("rock") &&
                choices.includes("scissors")
            ) {

                winningChoice = "rock";

            }


            if (
                choices.includes("scissors") &&
                choices.includes("paper")
            ) {

                winningChoice = "scissors";

            }


            if (
                choices.includes("paper") &&
                choices.includes("rock")
            ) {

                winningChoice = "paper";

            }


            const winners =
                players
                .filter(
                    player =>
                    player.choice ===
                    winningChoice
                )
                .map(
                    player =>
                    player.displayName
                );


            html +=
                "<br><strong>🏆 勝利：" +
                winners.join("、") +
                "</strong>";

        }


        resultBox.innerHTML =
            html;


        document.getElementById("status").innerText =
            "本局已完成";

    }


    initializeLiff();

</script>

</body>
</html>
