<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匿名猜拳</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            margin-top: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        input {
            box-sizing: border-box;
            width: 90%;
            max-width: 300px;
            padding: 13px;
            margin: 7px 0;
            font-size: 18px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .normal-btn {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
            background: #06c755;
            color: white;
        }

        .secondary-btn {
            background: #555;
        }

        .share-btn {
            background: #1687ff;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .choice {
            width: 95px;
            height: 115px;
            border: none;
            border-radius: 18px;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            font-size: 48px;
            cursor: pointer;
        }

        .choice:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #roomArea,
        #gameArea {
            display: none;
        }

        #roomCodeDisplay {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 5px;
            margin: 10px 0;
        }

        #playerList {
            text-align: left;
            margin-top: 20px;
        }

        .player-row {
            padding: 12px 5px;
            border-bottom: 1px solid #eee;
        }

        #status {
            margin-top: 18px;
            color: #666;
        }

        #result {
            margin-top: 22px;
            font-size: 20px;
            line-height: 1.8;
        }

        .hint {
            color: #888;
            font-size: 14px;
            line-height: 1.5;
        }

        #copyMessage {
            color: #06a844;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎮 匿名猜拳</h1>

    <div class="subtitle">
        不需要 LINE 登入，自己取一個匿名暱稱就可以玩
    </div>


    <!-- 首頁 -->
    <div id="lobbyArea" class="card">

        <h2>你的匿名暱稱</h2>

        <input
            id="nicknameInput"
            type="text"
            maxlength="12"
            placeholder="例如：草莓、黑貓、玩家87"
        >

        <p class="hint">
            遊戲只會顯示你自己填寫的暱稱
        </p>

        <button
            class="normal-btn"
            onclick="createRoom()"
        >
            🎮 建立房間
        </button>

        <hr style="margin:25px 0; border:none; border-top:1px solid #eee;">

        <h3>加入朋友的房間</h3>

        <input
            id="roomInput"
            type="text"
            maxlength="4"
            placeholder="輸入 4 位房號"
            inputmode="numeric"
        >

        <br>

        <button
            class="normal-btn secondary-btn"
            onclick="joinRoom()"
        >
            🚪 加入房間
        </button>

    </div>


    <!-- 房間 -->
    <div id="roomArea" class="card">

        <div>房間號碼</div>

        <div id="roomCodeDisplay"></div>

        <button
            class="normal-btn share-btn"
            onclick="copyInviteLink()"
        >
            📋 複製邀請連結
        </button>

        <div id="copyMessage"></div>

        <div id="playerList"></div>

        <div id="status">
            等待其他玩家加入...
        </div>

    </div>


    <!-- 遊戲 -->
    <div id="gameArea" class="card">

        <h2>請選擇你的出拳</h2>

        <div class="choices">

            <button
                class="choice"
                onclick="choose('rock')"
            >
                ✊
            </button>

            <button
                class="choice"
                onclick="choose('scissors')"
            >
                ✌️
            </button>

            <button
                class="choice"
                onclick="choose('paper')"
            >
                🖐️
            </button>

        </div>

        <div id="result"></div>

        <button
            id="restartBtn"
            class="normal-btn"
            onclick="restartGame()"
            style="display:inline-block; margin-top:20px;"
        >
            🔄 再玩一局
        </button>

    </div>

</div>


<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
        updateDoc,
        onSnapshot,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // ======================================
    // Firebase
    // ======================================

    const firebaseConfig = {

        apiKey:
        "AIzaSyBgIL1m6WvO9H23EJ1RUxd_gzAiVnnnWEo",

        authDomain:
        "janken-game-69aa6.firebaseapp.com",

        projectId:
        "janken-game-69aa6",

        storageBucket:
        "janken-game-69aa6.firebasestorage.app",

        messagingSenderId:
        "676529713314",

        appId:
        "1:676529713314:web:3e127ae463d68a250a27fb",

        measurementId:
        "G-BK85KK19FG"

    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    let currentRoom = null;
    let currentNickname = null;
    let unsubscribeRoom = null;


    // ======================================
    // 匿名玩家 ID
    // ======================================

    function getPlayerId() {

        let playerId =
            localStorage.getItem(
                "jankenPlayerId"
            );


        if (!playerId) {

            if (crypto.randomUUID) {

                playerId =
                    "p_" +
                    crypto.randomUUID();

            } else {

                playerId =
                    "p_" +
                    Date.now() +
                    "_" +
                    Math.random()
                    .toString(36)
                    .substring(2);

            }


            localStorage.setItem(
                "jankenPlayerId",
                playerId
            );

        }


        return playerId;

    }


    const playerId =
        getPlayerId();


    // ======================================
    // 網址有沒有房號
    // ======================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const sharedRoom =
        params.get("room");


    if (sharedRoom) {

        document
        .getElementById("roomInput")
        .value =
            sharedRoom;

    }


    // ======================================
    // 暱稱
    // ======================================

    function getNickname() {

        const nickname =
            document
            .getElementById("nicknameInput")
            .value
            .trim();


        if (!nickname) {

            alert(
                "請先輸入你的匿名暱稱"
            );

            return null;

        }


        if (nickname.length > 12) {

            alert(
                "暱稱最多 12 個字"
            );

            return null;

        }


        currentNickname =
            nickname;


        return nickname;

    }


    // ======================================
    // 產生房號
    // ======================================

    function generateRoomCode() {

        return Math.floor(
            1000 +
            Math.random() * 9000
        ).toString();

    }


    // ======================================
    // 建立房間
    // ======================================

    window.createRoom =
    async function() {

        const nickname =
            getNickname();


        if (!nickname) {
            return;
        }


        try {

            let roomCode =
                generateRoomCode();


            let roomRef =
                doc(
                    db,
                    "rooms",
                    roomCode
                );


            let roomSnap =
                await getDoc(
                    roomRef
                );


            while (
                roomSnap.exists()
            ) {

                roomCode =
                    generateRoomCode();


                roomRef =
                    doc(
                        db,
                        "rooms",
                        roomCode
                    );


                roomSnap =
                    await getDoc(
                        roomRef
                    );

            }


            await setDoc(
                roomRef,
                {

                    createdAt:
                        serverTimestamp(),

                    hostId:
                        playerId,

                    status:
                        "waiting",

                    players: {

                        [playerId]: {

                            nickname:
                                nickname,

                            choice:
                                null,

                            ready:
                                false

                        }

                    }

                }
            );


            enterRoom(
                roomCode
            );


        } catch (error) {

            console.error(error);

            alert(
                "建立房間失敗：" +
                error.message
            );

        }

    };


    // ======================================
    // 加入房間
    // ======================================

    window.joinRoom =
    async function() {

        const nickname =
            getNickname();


        if (!nickname) {
            return;
        }


        const roomCode =
            document
            .getElementById("roomInput")
            .value
            .trim();


        if (
            !/^\d{4}$/.test(
                roomCode
            )
        ) {

            alert(
                "請輸入正確的 4 位房號"
            );

            return;

        }


        try {

            const roomRef =
                doc(
                    db,
                    "rooms",
                    roomCode
                );


            const roomSnap =
                await getDoc(
                    roomRef
                );


            if (
                !roomSnap.exists()
            ) {

                alert(
                    "找不到這個房間"
                );

                return;

            }


            const data =
                roomSnap.data();


            const players =
                data.players || {};


            const oldPlayer =
                players[playerId];


            players[playerId] = {

                nickname:
                    nickname,

                choice:
                    oldPlayer
                    ? oldPlayer.choice
                    : null,

                ready:
                    oldPlayer
                    ? oldPlayer.ready
                    : false

            };


            await updateDoc(
                roomRef,
                {
                    players:
                        players
                }
            );


            enterRoom(
                roomCode
            );


        } catch (error) {

            console.error(error);

            alert(
                "加入房間失敗：" +
                error.message
            );

        }

    };


    // ======================================
    // 進入房間
    // ======================================

    function enterRoom(
        roomCode
    ) {

        currentRoom =
            roomCode;


        document
        .getElementById(
            "lobbyArea"
        )
        .style.display =
            "none";


        document
        .getElementById(
            "roomArea"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "gameArea"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "roomCodeDisplay"
        )
        .innerText =
            roomCode;


        listenRoom(
            roomCode
        );

    }


    // ======================================
    // 複製邀請連結
    // ======================================

    window.copyInviteLink =
    async function() {

        if (!currentRoom) {
            return;
        }


        const inviteUrl =
            "https://mayimai13.github.io/janken-game/?room=" +
            encodeURIComponent(
                currentRoom
            );


        try {

            await navigator
                .clipboard
                .writeText(
                    inviteUrl
                );


            document
            .getElementById(
                "copyMessage"
            )
            .innerText =
                "✅ 邀請連結已複製！直接貼到群組即可";


        } catch (error) {

            prompt(
                "請複製這個邀請連結：",
                inviteUrl
            );

        }

    };


    // ======================================
    // 即時監聽房間
    // ======================================

    function listenRoom(
        roomCode
    ) {

        if (unsubscribeRoom) {

            unsubscribeRoom();

        }


        const roomRef =
            doc(
                db,
                "rooms",
                roomCode
            );


        unsubscribeRoom =
        onSnapshot(

            roomRef,

            (snapshot) => {

                if (
                    !snapshot.exists()
                ) {

                    return;

                }


                const data =
                    snapshot.data();


                const players =
                    data.players || {};


                renderPlayers(
                    players
                );


                checkResult(
                    players
                );

            },

            (error) => {

                console.error(error);


                document
                .getElementById(
                    "status"
                )
                .innerText =
                    "❌ 房間連線失敗";

            }

        );

    }


    // ======================================
    // 顯示玩家
    // ======================================

    function renderPlayers(
        players
    ) {

        const list =
            document
            .getElementById(
                "playerList"
            );


        list.innerHTML =
            "";


        Object.entries(
            players
        )
        .forEach(
            ([id, player]) => {

                const row =
                    document
                    .createElement(
                        "div"
                    );


                row.className =
                    "player-row";


                let name =
                    player.nickname ||
                    "匿名玩家";


                if (
                    id === playerId
                ) {

                    name +=
                        "（你）";

                }


                row.innerText =
                    name +
                    "　" +
                    (
                        player.ready
                        ? "✅ 已出拳"
                        : "⏳ 尚未出拳"
                    );


                list.appendChild(
                    row
                );

            }
        );

    }


    // ======================================
    // 出拳
    // ======================================

    window.choose =
    async function(choice) {

        if (
            !currentRoom ||
            !currentNickname
        ) {

            return;

        }


        try {

            const roomRef =
                doc(
                    db,
                    "rooms",
                    currentRoom
                );


            const roomSnap =
                await getDoc(
                    roomRef
                );


            if (
                !roomSnap.exists()
            ) {

                return;

            }


            const data =
                roomSnap.data();


            const players =
                data.players || {};


            players[playerId] = {

                nickname:
                    currentNickname,

                choice:
                    choice,

                ready:
                    true

            };


            await updateDoc(
                roomRef,
                {
                    players:
                        players
                }
            );


            document
            .querySelectorAll(
                ".choice"
            )
            .forEach(
                button => {

                    button.disabled =
                        true;

                }
            );


            document
            .getElementById(
                "status"
            )
            .innerText =
                "✅ 你已出拳，等待其他玩家";


        } catch (error) {

            console.error(error);

            alert(
                "出拳失敗：" +
                error.message
            );

        }

    };


    // ======================================
    // 檢查是否全部出拳
    // ======================================

    function checkResult(
        players
    ) {

        const playerArray =
            Object.values(
                players
            );


        if (
            playerArray.length < 2
        ) {

            document
            .getElementById(
                "status"
            )
            .innerText =
                "等待其他玩家加入...";


            document
            .getElementById(
                "result"
            )
            .innerHTML =
                "";


            return;

        }


        const allReady =
            playerArray.every(
                player =>
                    player.ready
            );


        if (!allReady) {

            document
            .getElementById(
                "status"
            )
            .innerText =
                "等待所有玩家出拳...";


            document
            .getElementById(
                "result"
            )
            .innerHTML =
                "";


            return;

        }


        showResult(
            playerArray
        );

    }


    // ======================================
    // 公布結果
    // ======================================

    function showResult(
        players
    ) {

        const emoji = {

            rock:
                "✊ 石頭",

            scissors:
                "✌️ 剪刀",

            paper:
                "🖐️ 布"

        };


        let html =
            "<h3>🎊 全員完成</h3>";


        players.forEach(
            player => {

                html +=
                    escapeHtml(
                        player.nickname
                    ) +
                    "： " +
                    emoji[
                        player.choice
                    ] +
                    "<br>";

            }
        );


        const choices =
            [
                ...new Set(
                    players.map(
                        player =>
                            player.choice
                    )
                )
            ];


        if (
            choices.length === 1 ||
            choices.length === 3
        ) {

            html +=
                "<br><strong>🤝 平手！</strong>";

        }

        else {

            let winningChoice =
                "";


            if (
                choices.includes("rock") &&
                choices.includes("scissors")
            ) {

                winningChoice =
                    "rock";

            }

            else if (
                choices.includes("scissors") &&
                choices.includes("paper")
            ) {

                winningChoice =
                    "scissors";

            }

            else if (
                choices.includes("paper") &&
                choices.includes("rock")
            ) {

                winningChoice =
                    "paper";

            }


            const winners =
                players
                .filter(
                    player =>
                        player.choice ===
                        winningChoice
                )
                .map(
                    player =>
                        escapeHtml(
                            player.nickname
                        )
                );


            html +=
                "<br><strong>🏆 勝利：" +
                winners.join("、") +
                "</strong>";

        }


        document
        .getElementById(
            "result"
        )
        .innerHTML =
            html;


        document
        .getElementById(
            "status"
        )
        .innerText =
            "🎉 本局已完成";

    }


    // ======================================
    // 再玩一局
    // ======================================

    window.restartGame =
    async function() {

        if (!currentRoom) {
            return;
        }


        try {

            const roomRef =
                doc(
                    db,
                    "rooms",
                    currentRoom
                );


            const roomSnap =
                await getDoc(
                    roomRef
                );


            if (
                !roomSnap.exists()
            ) {

                return;

            }


            const data =
                roomSnap.data();


            const players =
                data.players || {};


            Object.keys(
                players
            )
            .forEach(
                id => {

                    players[id].choice =
                        null;

                    players[id].ready =
                        false;

                }
            );


            await updateDoc(
                roomRef,
                {

                    players:
                        players,

                    status:
                        "waiting"

                }
            );


            document
            .getElementById(
                "result"
            )
            .innerHTML =
                "";


            document
            .querySelectorAll(
                ".choice"
            )
            .forEach(
                button => {

                    button.disabled =
                        false;

                }
            );


            document
            .getElementById(
                "status"
            )
            .innerText =
                "🔄 新的一局開始！請出拳";


        } catch (error) {

            console.error(error);

            alert(
                "重新開始失敗：" +
                error.message
            );

        }

    };


    // ======================================
    // 防止暱稱塞 HTML
    // ======================================

    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            text;

        return div.innerHTML;

    }

</script>

</body>
</html>
