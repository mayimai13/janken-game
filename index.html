<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE 多人猜拳</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            margin-top: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        #userInfo {
            color: #555;
            margin-top: 10px;
        }

        input {
            width: 80%;
            max-width: 260px;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .normal-btn {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
            background: #06c755;
            color: white;
        }

        .secondary-btn {
            background: #555;
        }

        .test-btn {
            background: #7b61ff;
        }

        .bot-btn {
            background: #ff9500;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .choice {
            width: 95px;
            height: 115px;
            border: none;
            border-radius: 18px;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            font-size: 48px;
            cursor: pointer;
        }

        .choice:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #roomArea,
        #gameArea {
            display: none;
        }

        #roomCodeDisplay {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
            margin: 10px 0;
        }

        #playerList {
            text-align: left;
            margin-top: 20px;
        }

        .player-row {
            padding: 12px 5px;
            border-bottom: 1px solid #eee;
        }

        #status {
            margin-top: 18px;
            color: #666;
            font-size: 15px;
        }

        #result {
            margin-top: 22px;
            font-size: 20px;
            line-height: 1.8;
        }

        .test-area {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
        }

        .test-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎮 LINE 多人猜拳</h1>

    <div id="userInfo">
        正在連接 LINE...
    </div>

    <!-- 首頁 -->
    <div id="lobbyArea" class="card">

        <h2>開始遊戲</h2>

        <button class="normal-btn" onclick="createRoom()">
            🎮 建立房間
        </button>

        <hr style="margin:25px 0; border:none; border-top:1px solid #eee;">

        <input
            id="roomInput"
            type="text"
            maxlength="4"
            placeholder="輸入 4 位房號"
            inputmode="numeric"
        >

        <br>

        <button class="normal-btn secondary-btn" onclick="joinRoom()">
            加入房間
        </button>

    </div>

    <!-- 房間 -->
    <div id="roomArea" class="card">

        <div>房間號碼</div>

        <div id="roomCodeDisplay"></div>

        <div id="playerList"></div>

        <div id="status">
            等待玩家...
        </div>

        <div class="test-area">

            <div class="test-title">
                🧪 單人測試工具
            </div>

            <button
                class="normal-btn test-btn"
                onclick="addTestPlayer()"
            >
                🧪 加入測試玩家
            </button>

            <button
                class="normal-btn bot-btn"
                onclick="testPlayerMove()"
            >
                🎲 測試玩家出拳
            </button>

        </div>

    </div>

    <!-- 出拳 -->
    <div id="gameArea" class="card">

        <h2>請選擇你的出拳</h2>

        <div class="choices">

            <button class="choice" onclick="choose('rock')">
                ✊
            </button>

            <button class="choice" onclick="choose('scissors')">
                ✌️
            </button>

            <button class="choice" onclick="choose('paper')">
                🖐️
            </button>

        </div>

        <div id="result"></div>

        <button
            id="restartBtn"
            class="normal-btn"
            onclick="restartGame()"
            style="display:inline-block; margin-top:20px;"
        >
            🔄 再玩一局
        </button>

    </div>

</div>

<!-- LINE LIFF -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
        updateDoc,
        onSnapshot,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // ===============================
    // Firebase
    // ===============================

    const firebaseConfig = {

        apiKey:
        "AIzaSyBgIL1m6WvO9H23EJ1RUxd_gzAiVnnnWEo",

        authDomain:
        "janken-game-69aa6.firebaseapp.com",

        projectId:
        "janken-game-69aa6",

        storageBucket:
        "janken-game-69aa6.firebasestorage.app",

        messagingSenderId:
        "676529713314",

        appId:
        "1:676529713314:web:3e127ae463d68a250a27fb",

        measurementId:
        "G-BK85KK19FG"

    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;
    let currentRoom = null;
    let unsubscribeRoom = null;


    // ===============================
    // LINE
    // ===============================

    async function initializeLiff() {

        try {

            await liff.init({
                liffId: "2011114180-glOZVk21"
            });

            if (!liff.isLoggedIn()) {

                liff.login();
                return;

            }

            currentUser = await liff.getProfile();

            document.getElementById("userInfo").innerText =
                "👋 " + currentUser.displayName;

        } catch (error) {

            console.error(error);

            document.getElementById("userInfo").innerText =
                "❌ LINE 連線失敗";

        }

    }


    // ===============================
    // 房號
    // ===============================

    function generateRoomCode() {

        return Math.floor(
            1000 + Math.random() * 9000
        ).toString();

    }


    // ===============================
    // 建立房間
    // ===============================

    window.createRoom = async function() {

        if (!currentUser) {

            alert("LINE 尚未連線完成");
            return;

        }

        try {

            let roomCode = generateRoomCode();

            let roomRef =
                doc(db, "rooms", roomCode);

            let roomSnap =
                await getDoc(roomRef);


            while (roomSnap.exists()) {

                roomCode =
                    generateRoomCode();

                roomRef =
                    doc(db, "rooms", roomCode);

                roomSnap =
                    await getDoc(roomRef);

            }


            await setDoc(roomRef, {

                createdAt:
                    serverTimestamp(),

                hostId:
                    currentUser.userId,

                status:
                    "waiting",

                players: {

                    [currentUser.userId]: {

                        displayName:
                            currentUser.displayName,

                        choice:
                            null,

                        ready:
                            false

                    }

                }

            });


            enterRoom(roomCode);

        } catch (error) {

            console.error(error);

            alert(
                "建立房間失敗：" +
                error.message
            );

        }

    };


    // ===============================
    // 加入房間
    // ===============================

    window.joinRoom = async function() {

        if (!currentUser) {

            alert("LINE 尚未連線完成");
            return;

        }


        const roomCode =
            document
            .getElementById("roomInput")
            .value
            .trim();


        if (roomCode.length !== 4) {

            alert("請輸入 4 位房號");
            return;

        }


        try {

            const roomRef =
                doc(db, "rooms", roomCode);


            const roomSnap =
                await getDoc(roomRef);


            if (!roomSnap.exists()) {

                alert("找不到這個房間");
                return;

            }


            const data =
                roomSnap.data();


            const players =
                data.players || {};


            players[currentUser.userId] = {

                displayName:
                    currentUser.displayName,

                choice:
                    null,

                ready:
                    false

            };


            await updateDoc(roomRef, {
                players: players
            });


            enterRoom(roomCode);

        } catch (error) {

            console.error(error);

            alert(
                "加入房間失敗：" +
                error.message
            );

        }

    };


    // ===============================
    // 進房
    // ===============================

    function enterRoom(roomCode) {

        currentRoom =
            roomCode;


        document
        .getElementById("lobbyArea")
        .style.display =
            "none";


        document
        .getElementById("roomArea")
        .style.display =
            "block";


        document
        .getElementById("gameArea")
        .style.display =
            "block";


        document
        .getElementById("roomCodeDisplay")
        .innerText =
            roomCode;


        listenRoom(roomCode);

    }


    // ===============================
    // 即時監聽
    // ===============================

    function listenRoom(roomCode) {

        if (unsubscribeRoom) {
            unsubscribeRoom();
        }


        const roomRef =
            doc(db, "rooms", roomCode);


        unsubscribeRoom =
        onSnapshot(
            roomRef,

            (snapshot) => {

                if (!snapshot.exists()) {
                    return;
                }


                const data =
                    snapshot.data();


                const players =
                    data.players || {};


                renderPlayers(players);

                checkResult(players);

            },

            (error) => {

                console.error(error);

                document
                .getElementById("status")
                .innerText =
                    "❌ 房間連線失敗";

            }
        );

    }


    // ===============================
    // 玩家列表
    // ===============================

    function renderPlayers(players) {

        const list =
            document
            .getElementById("playerList");


        list.innerHTML = "";


        Object.entries(players)
        .forEach(([id, player]) => {

            const row =
                document.createElement("div");


            row.className =
                "player-row";


            let name =
                player.displayName;


            if (id === "test-player") {

                name =
                    "🤖 " + name;

            }


            row.innerText =
                name +
                "　" +
                (
                    player.ready
                    ? "✅ 已出拳"
                    : "⏳ 尚未出拳"
                );


            list.appendChild(row);

        });

    }


    // ===============================
    // 真人玩家出拳
    // ===============================

    window.choose = async function(choice) {

        if (!currentRoom || !currentUser) {
            return;
        }


        try {

            const roomRef =
                doc(db, "rooms", currentRoom);


            const roomSnap =
                await getDoc(roomRef);


            if (!roomSnap.exists()) {
                return;
            }


            const data =
                roomSnap.data();


            const players =
                data.players || {};


            players[currentUser.userId] = {

                displayName:
                    currentUser.displayName,

                choice:
                    choice,

                ready:
                    true

            };


            await updateDoc(roomRef, {
                players: players
            });


            document
            .getElementById("status")
            .innerText =
                "✅ 你已出拳，等待其他玩家";


            document
            .querySelectorAll(".choice")
            .forEach(button => {

                button.disabled = true;

            });


        } catch (error) {

            console.error(error);

            alert(
                "出拳失敗：" +
                error.message
            );

        }

    };


    // ===============================
    // 加入測試玩家
    // ===============================

    window.addTestPlayer = async function() {

        if (!currentRoom) {

            alert("請先建立房間");
            return;

        }


        try {

            const roomRef =
                doc(db, "rooms", currentRoom);


            const roomSnap =
                await getDoc(roomRef);


            if (!roomSnap.exists()) {
                return;
            }


            const data =
                roomSnap.data();


            const players =
                data.players || {};


            players["test-player"] = {

                displayName:
                    "測試玩家",

                choice:
                    null,

                ready:
                    false

            };


            await updateDoc(roomRef, {
                players: players
            });


            document
            .getElementById("status")
            .innerText =
                "🧪 測試玩家已加入";

        } catch (error) {

            console.error(error);

            alert(
                "加入測試玩家失敗：" +
                error.message
            );

        }

    };


    // ===============================
    // 測試玩家出拳
    // ===============================

    window.testPlayerMove = async function() {

        if (!currentRoom) {

            alert("請先建立房間");
            return;

        }


        try {

            const roomRef =
                doc(db, "rooms", currentRoom);


            const roomSnap =
                await getDoc(roomRef);


            if (!roomSnap.exists()) {
                return;
            }


            const data =
                roomSnap.data();


            const players =
                data.players || {};


            if (!players["test-player"]) {

                alert(
                    "請先按「加入測試玩家」"
                );

                return;

            }


            if (players["test-player"].ready) {

                alert("測試玩家已經出拳");
                return;

            }


            const choices = [
                "rock",
                "scissors",
                "paper"
            ];


            const randomChoice =
                choices[
                    Math.floor(
                        Math.random() *
                        choices.length
                    )
                ];


            players["test-player"] = {

                displayName:
                    "測試玩家",

                choice:
                    randomChoice,

                ready:
                    true

            };


            await updateDoc(roomRef, {
                players: players
            });


            document
            .getElementById("status")
            .innerText =
                "🎲 測試玩家已出拳";

        } catch (error) {

            console.error(error);

            alert(
                "測試玩家出拳失敗：" +
                error.message
            );

        }

    };


    // ===============================
    // 檢查是否全部完成
    // ===============================

    function checkResult(players) {

        const playerArray =
            Object.values(players);


        if (playerArray.length < 2) {

            document
            .getElementById("status")
            .innerText =
                "等待其他玩家加入...";

            return;

        }


        const allReady =
            playerArray.every(
                player =>
                    player.ready
            );


        if (!allReady) {

            document
            .getElementById("status")
            .innerText =
                "等待所有玩家出拳...";

            return;

        }


        showResult(playerArray);

    }


    // ===============================
    // 公布結果
    // ===============================

    function showResult(players) {

        const resultBox =
            document
            .getElementById("result");


        const emoji = {

            rock:
                "✊ 石頭",

            scissors:
                "✌️ 剪刀",

            paper:
                "🖐️ 布"

        };


        let html =
            "<h3>🎊 全員完成</h3>";


        players.forEach(player => {

            html +=
                player.displayName +
                "： " +
                emoji[player.choice] +
                "<br>";

        });


        const choices =
            [
                ...new Set(
                    players.map(
                        player =>
                            player.choice
                    )
                )
            ];


        if (
            choices.length === 1 ||
            choices.length === 3
        ) {

            html +=
                "<br><strong>🤝 平手！</strong>";

        }

        else {

            let winningChoice = "";


            if (
                choices.includes("rock") &&
                choices.includes("scissors")
            ) {

                winningChoice =
                    "rock";

            }


            else if (
                choices.includes("scissors") &&
                choices.includes("paper")
            ) {

                winningChoice =
                    "scissors";

            }


            else if (
                choices.includes("paper") &&
                choices.includes("rock")
            ) {

                winningChoice =
                    "paper";

            }


            const winners =
                players
                .filter(
                    player =>
                        player.choice ===
                        winningChoice
                )
                .map(
                    player =>
                        player.displayName
                );


            html +=
                "<br><strong>🏆 勝利：" +
                winners.join("、") +
                "</strong>";

        }


        resultBox.innerHTML =
            html;


        document
        .getElementById("restartBtn")
        .style.display =
            "inline-block";


        document
        .getElementById("status")
        .innerText =
            "🎉 本局已完成";

    }


    // ===============================
    // 再玩一局
    // ===============================

    window.restartGame = async function() {

        if (!currentRoom) {
            return;
        }


        try {

            const roomRef =
                doc(db, "rooms", currentRoom);


            const roomSnap =
                await getDoc(roomRef);


            if (!roomSnap.exists()) {
                return;
            }


            const data =
                roomSnap.data();


            const players =
                data.players || {};


            Object.keys(players)
            .forEach(id => {

                players[id].choice = null;
                players[id].ready = false;

            });


            await updateDoc(roomRef, {

                players:
                    players,

                status:
                    "waiting"

            });


            document
            .getElementById("result")
            .innerHTML =
                "";


            document
            .getElementById("restartBtn")
            .style.display =
                "none";


            document
            .querySelectorAll(".choice")
            .forEach(button => {

                button.disabled = false;

            });


            document
            .getElementById("status")
            .innerText =
                "🔄 新的一局開始！請出拳";

        } catch (error) {

            console.error(error);

            alert(
                "重新開始失敗：" +
                error.message
            );

        }

    };


    // 啟動 LINE
    initializeLiff();

</script>

</body>
</html>
