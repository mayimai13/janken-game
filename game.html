<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>匿名猜拳淘汰賽</title>

<style>

body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f5f5f5;
    text-align: center;
    color: #222;
}

.container {
    max-width: 580px;
    margin: auto;
    padding: 25px 18px 60px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 24px;
    margin-top: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,.10);
}

.room-number {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 5px;
    margin: 8px;
}

.round {
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
}

.round-state {
    margin-top: 10px;
    font-weight: bold;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 20px;
    margin: 7px;
    font-size: 16px;
    cursor: pointer;
    color: white;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.share-btn {
    background: #1687ff;
}

.close-join-btn {
    background: #ff9800;
}

.start-btn {
    background: #06c755;
}

.end-round-btn {
    background: #e53935;
}

.next-btn {
    background: #7b61ff;
}

.group-btn {
    background: #7b61ff;
}

.normal-btn {
    background: #555;
}

.choice-area {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
}

.choice {
    width: 95px;
    height: 115px;
    background: white;
    color: #222;
    font-size: 48px;
    box-shadow: 0 3px 12px rgba(0,0,0,.15);
}

.player-list {
    text-align: left;
}

.player {
    padding: 12px 5px;
    border-bottom: 1px solid #eee;
}

.spectator {
    color: #999;
}

.temp-watch {
    color: #777;
}

.host-box {
    padding: 12px;
    background: #fff8e1;
    border-radius: 12px;
    margin-bottom: 15px;
}

.hint {
    font-size: 14px;
    color: #888;
}

#status {
    margin-top: 15px;
    color: #666;
}

#result {
    line-height: 1.8;
    margin-top: 20px;
}

#hostControls,
#groupDecisionArea,
#groupControlArea {
    display: none;
}

#startRoundBtn,
#endRoundBtn,
#nextRoundBtn {
    display: none;
}

#watchMessage {
    display: none;
    background: #fafafa;
    padding: 18px;
    margin-top: 15px;
    border-radius: 12px;
}

#winnerArea {
    display: none;
}

.winner {
    font-size: 30px;
    font-weight: bold;
}

.group-box {
    padding: 14px;
    margin: 10px 0;
    background: #fafafa;
    border-radius: 12px;
    text-align: left;
}

.group-title {
    font-size: 18px;
    font-weight: bold;
}

.group-status {
    color: #777;
    font-size: 14px;
    margin-top: 4px;
}

/* Chat */

.chat-card {
    text-align: left;
}

.chat-title {
    text-align: center;
}

#chatMessages {
    height: 300px;
    overflow-y: auto;
    background: #fafafa;
    border-radius: 12px;
    border: 1px solid #eee;
    padding: 10px;
}

.chat-message {
    padding: 9px 11px;
    background: white;
    border-radius: 10px;
    margin-bottom: 10px;
}

.chat-name {
    font-weight: bold;
    font-size: 14px;
}

.chat-text {
    margin-top: 4px;
    word-break: break-word;
}

.chat-input-area {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

#chatInput {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

.chat-send {
    background: #1687ff;
    margin: 0;
}

#chatCount {
    text-align: right;
    font-size: 12px;
    color: #999;
    margin-top: 4px;
}

</style>

</head>


<body>

<div class="container">


<h1>
🎮 匿名猜拳淘汰賽
</h1>


<!-- 房間 -->

<div class="card">

<div>
房間號碼
</div>

<div
    id="roomNumber"
    class="room-number"
>
</div>

<div
    id="roundNumber"
    class="round"
>
</div>

<div
    id="roundState"
    class="round-state"
>
🟢 等待參賽者加入
</div>


<button
    class="share-btn"
    onclick="copyInviteLink()"
>
📋 複製邀請連結
</button>


<div id="copyMessage">
</div>

<div id="joinStatus">
🟢 開放加入
</div>

</div>


<!-- 玩家 -->

<div class="card">

<div
    id="hostBox"
    class="host-box"
>
</div>

<h2>
👥 參賽玩家
</h2>

<div
    id="playerList"
    class="player-list"
>
</div>

<div id="status">
等待玩家...
</div>

</div>


<!-- 遊戲 -->

<div class="card">

<h2 id="gameTitle">
🟢 等待其他參賽者加入
</h2>


<div class="choice-area">

<button
    class="choice"
    onclick="choose('rock')"
>
✊
</button>

<button
    class="choice"
    onclick="choose('scissors')"
>
✌️
</button>

<button
    class="choice"
    onclick="choose('paper')"
>
🖐️
</button>

</div>


<div id="watchMessage">
👀 目前為觀賽模式
</div>


<div id="result">
</div>


<!-- 房主一般控制 -->

<div id="hostControls">

<div class="hint">
👑 房主控制
</div>

<button
    id="closeJoinBtn"
    class="close-join-btn"
    onclick="closeJoining()"
>
🔒 結束加入
</button>


<button
    id="startRoundBtn"
    class="start-btn"
    onclick="startRound()"
>
▶️ 開始淘汰賽
</button>


<button
    id="endRoundBtn"
    class="end-round-btn"
    onclick="endRound()"
>
🛑 結束本輪
</button>


<button
    id="nextRoundBtn"
    class="next-btn"
    onclick="prepareNextRound()"
>
🔄 準備下一輪
</button>

</div>

</div>


<!-- 第一輪決策 -->

<div
    id="groupDecisionArea"
    class="card"
>

<h2>
📊 第一輪完成
</h2>

<p>
房主要如何進行下一階段？
</p>

<div id="firstRoundGroupSummary">
</div>


<button
    class="group-btn"
    onclick="enableGroupMode()"
>
👥 依第一輪出拳分組
</button>


<button
    class="normal-btn"
    onclick="continueWithoutGroups()"
>
➡️ 不分組，直接判定
</button>

</div>


<!-- 分組控制 -->

<div
    id="groupControlArea"
    class="card"
>

<h2>
👥 分組淘汰
</h2>

<p class="hint">
房主可自行決定哪一組先進行
</p>


<div id="groupList">
</div>


<button
    id="finishGroupsBtn"
    class="next-btn"
    style="display:none;"
    onclick="finishGroupStage()"
>
✅ 分組比賽完成，進入下一輪
</button>

</div>


<!-- 冠軍 -->

<div
    id="winnerArea"
    class="card"
>

<h2>
🎉 比賽結束
</h2>

<div
    id="finalWinner"
    class="winner"
>
</div>

</div>


<!-- 聊天 -->

<div class="card chat-card">

<h2 class="chat-title">
💬 房間討論區
</h2>

<div id="chatMessages">
</div>

<div class="chat-input-area">

<input
    id="chatInput"
    maxlength="100"
    placeholder="輸入訊息..."
>

<button
    class="chat-send"
    onclick="sendMessage()"
>
送出
</button>

</div>

<div id="chatCount">
0 / 100
</div>

</div>


</div>


<script type="module">


import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {

    getFirestore,
    doc,
    onSnapshot,
    runTransaction,
    collection,
    addDoc,
    query,
    orderBy,
    limit,
    serverTimestamp

}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBgIL1m6WvO9H23EJ1RUxd_gzAiVnnnWEo",

    authDomain:
    "janken-game-69aa6.firebaseapp.com",

    projectId:
    "janken-game-69aa6",

    storageBucket:
    "janken-game-69aa6.firebasestorage.app",

    messagingSenderId:
    "676529713314",

    appId:
    "1:676529713314:web:3e127ae463d68a250a27fb",

    measurementId:
    "G-BK85KK19FG"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        app
    );


const playerId =
    sessionStorage.getItem(
        "jankenPlayerId"
    );


const nickname =
    sessionStorage.getItem(
        "jankenNickname"
    );


const params =
    new URLSearchParams(
        window.location.search
    );


const roomCode =
    params.get(
        "room"
    );


if (
    !playerId ||
    !nickname ||
    !roomCode
) {

    alert(
        "資料不存在，請重新加入"
    );


    window.location.href =
        "index.html";

}


const roomRef =
    doc(
        db,
        "rooms",
        roomCode
    );


let roomData =
    null;


let isHost =
    false;


const groupNames = {

    rock:
        "✊ 石頭組",

    scissors:
        "✌️ 剪刀組",

    paper:
        "🖐️ 布組"

};


// ======================================
// 即時監聽
// ======================================

onSnapshot(

    roomRef,

    snapshot => {

        if (
            !snapshot.exists()
        ) {

            return;

        }


        roomData =
            snapshot.data();


        isHost =
            roomData.hostId ===
            playerId;


        const players =
            roomData.players ||
            {};


        document
        .getElementById(
            "roomNumber"
        )
        .innerText =
            roomCode;


        document
        .getElementById(
            "roundNumber"
        )
        .innerText =
            "第 " +
            (
                roomData.round ||
                1
            ) +
            " 輪";


        document
        .getElementById(
            "hostBox"
        )
        .innerText =
            "👑 房主：" +
            (
                roomData.hostNickname ||
                "主持人"
            );


        document
        .getElementById(
            "hostControls"
        )
        .style.display =
            isHost
            ? "block"
            : "none";


        renderPlayers(
            players
        );


        updateJoinStatus();


        updateMainUI(
            players
        );


        updateHostControls();


        updateGroupDecision(
            players
        );


        updateGroupControl(
            players
        );


        checkWinner(
            players
        );

    }

);


// ======================================
// 加入狀態
// ======================================

function updateJoinStatus() {

    document
    .getElementById(
        "joinStatus"
    )
    .innerText =
        roomData.joinOpen !== false
        ? "🟢 開放加入"
        : "🔒 已停止加入";


    if (
        !isHost
    ) {

        return;

    }


    const btn =
        document
        .getElementById(
            "closeJoinBtn"
        );


    btn.disabled =
        roomData.joinOpen ===
        false;


    btn.innerText =
        roomData.joinOpen ===
        false
        ? "🔒 已停止加入"
        : "🔒 結束加入";

}


// ======================================
// 玩家列表
// ======================================

function renderPlayers(
    players
) {

    const box =
        document
        .getElementById(
            "playerList"
        );


    box.innerHTML =
        "";


    const entries =
        Object.entries(
            players
        );


    if (
        entries.length ===
        0
    ) {

        box.innerHTML =
            "<div class='player'>目前沒有參賽玩家</div>";


        return;

    }


    entries.forEach(

        (
            [
                id,
                player
            ]
        ) => {


            const row =
                document
                .createElement(
                    "div"
                );


            row.className =
                "player";


            let text =
                player.nickname;


            if (
                id ===
                playerId
            ) {

                text +=
                    "（你）";

            }


            if (
                player.status ===
                "spectator"
            ) {

                row.classList.add(
                    "spectator"
                );


                text +=
                    "　❌ 已淘汰";

            }

            else if (
                roomData.groupMode &&
                roomData.stage ===
                "group"
            ) {

                if (
                    player.group
                ) {

                    text +=
                        "　" +
                        (
                            groupNames[
                                player.group
                            ] ||
                            ""
                        );

                }


                if (
                    roomData.activeGroup &&
                    player.group !==
                    roomData.activeGroup
                ) {

                    row.classList.add(
                        "temp-watch"
                    );


                    text +=
                        "　👀 觀賽中";

                }

                else if (
                    player.group ===
                    roomData.activeGroup
                ) {

                    text +=
                        player.ready
                        ? "　✅ 已出拳"
                        : "　⏳ 尚未出拳";

                }

            }

            else {

                if (
                    roomData.roundStatus ===
                    "playing"
                ) {

                    text +=
                        player.ready
                        ? "　✅ 已出拳"
                        : "　⏳ 尚未出拳";

                }

                else {

                    text +=
                        "　🎮 等待";

                }

            }


            row.innerText =
                text;


            box.appendChild(
                row
            );

        }

    );

}


// ======================================
// 主畫面
// ======================================

function updateMainUI(
    players
) {

    const choiceArea =
        document.querySelector(
            ".choice-area"
        );


    const buttons =
        document.querySelectorAll(
            ".choice"
        );


    const me =
        players[
            playerId
        ];


    if (
        isHost
    ) {

        choiceArea.style.display =
            "none";


        document
        .getElementById(
            "gameTitle"
        )
        .innerText =
            "👑 房主主持模式";


        document
        .getElementById(
            "watchMessage"
        )
        .style.display =
            "none";

    }

    else if (
        !me
    ) {

        choiceArea.style.display =
            "none";

    }

    else if (
        me.status ===
        "spectator"
    ) {

        choiceArea.style.display =
            "none";


        document
        .getElementById(
            "gameTitle"
        )
        .innerText =
            "👀 已淘汰";


        document
        .getElementById(
            "watchMessage"
        )
        .style.display =
            "block";


        document
        .getElementById(
            "watchMessage"
        )
        .innerText =
            "👀 你已淘汰，目前為觀看模式";

    }

    else if (
        roomData.stage ===
        "group"
    ) {

        if (
            roomData.activeGroup !==
            me.group
        ) {

            choiceArea.style.display =
                "none";


            document
            .getElementById(
                "gameTitle"
            )
            .innerText =
                "👀 目前觀賽中";


            document
            .getElementById(
                "watchMessage"
            )
            .style.display =
                "block";


            if (
                roomData.activeGroup
            ) {

                document
                .getElementById(
                    "watchMessage"
                )
                .innerText =
                    "目前由 " +
                    groupNames[
                        roomData.activeGroup
                    ] +
                    " 進行比賽";

            }

            else {

                document
                .getElementById(
                    "watchMessage"
                )
                .innerText =
                    "等待房主選擇下一組比賽";

            }

        }

        else {

            choiceArea.style.display =
                "flex";


            document
            .getElementById(
                "watchMessage"
            )
            .style.display =
                "none";


            document
            .getElementById(
                "gameTitle"
            )
            .innerText =
                "⚔️ 輪到你的組別";


            buttons.forEach(
                btn => {

                    btn.disabled =
                        roomData.roundStatus !==
                        "groupPlaying" ||
                        me.ready;

                }
            );

        }

    }

    else {

        choiceArea.style.display =
            "flex";


        document
        .getElementById(
            "watchMessage"
        )
        .style.display =
            "none";


        if (
            roomData.joinOpen !==
            false
        ) {

            document
            .getElementById(
                "gameTitle"
            )
            .innerText =
                "🟢 等待其他參賽者加入";

        }

        else if (
            roomData.roundStatus ===
            "waiting"
        ) {

            document
            .getElementById(
                "gameTitle"
            )
            .innerText =
                (
                    roomData.round ||
                    1
                ) ===
                1
                ? "⏳ 等待房主開始淘汰賽"
                : "⏳ 等待房主開始本輪";

        }

        else if (
            roomData.roundStatus ===
            "playing"
        ) {

            document
            .getElementById(
                "gameTitle"
            )
            .innerText =
                me.ready
                ? "✅ 你已出拳"
                : "請選擇你的出拳";

        }

        else if (
            roomData.roundStatus ===
            "firstDecision"
        ) {

            document
            .getElementById(
                "gameTitle"
            )
            .innerText =
                "⏳ 等待房主決定下一階段";

        }

        else {

            document
            .getElementById(
                "gameTitle"
            )
            .innerText =
                "🏁 本輪已結束";

        }


        buttons.forEach(
            btn => {

                btn.disabled =
                    roomData.roundStatus !==
                    "playing" ||
                    me.ready;

            }
        );

    }


    updateStatus(
        players
    );

}


// ======================================
// 人數狀態
// ======================================

function updateStatus(
    players
) {

    const active =
        Object.values(
            players
        )
        .filter(
            p =>
                p.status ===
                "active"
        );


    if (
        roomData.stage ===
        "group" &&
        roomData.activeGroup
    ) {

        const current =
            active.filter(
                p =>
                    p.group ===
                    roomData.activeGroup
            );


        const ready =
            current.filter(
                p =>
                    p.ready
            );


        document
        .getElementById(
            "status"
        )
        .innerText =
            groupNames[
                roomData.activeGroup
            ] +
            "：" +
            ready.length +
            " / " +
            current.length +
            " 已出拳";


        return;

    }


    const ready =
        active.filter(
            p =>
                p.ready
        );


    document
    .getElementById(
        "status"
    )
    .innerText =
        "目前 " +
        active.length +
        " 位參賽者，" +
        ready.length +
        " 位已出拳";

}


// ======================================
// 房主一般按鈕
// ======================================

function updateHostControls() {

    if (
        !isHost
    ) {

        return;

    }


    const start =
        document.getElementById(
            "startRoundBtn"
        );


    const end =
        document.getElementById(
            "endRoundBtn"
        );


    const next =
        document.getElementById(
            "nextRoundBtn"
        );


    start.style.display =
        "none";


    end.style.display =
        "none";


    next.style.display =
        "none";


    if (
        roomData.stage ===
        "group"
    ) {

        return;

    }


    if (
        roomData.joinOpen !==
        false
    ) {

        return;

    }


    if (
        roomData.roundStatus ===
        "waiting"
    ) {

        start.style.display =
            "inline-block";


        start.innerText =
            (
                roomData.round ||
                1
            ) ===
            1
            ? "▶️ 開始淘汰賽"
            : "▶️ 開始本輪";

    }


    else if (
        roomData.roundStatus ===
        "playing"
    ) {

        end.style.display =
            "inline-block";

    }


    else if (
        roomData.roundStatus ===
        "ended"
    ) {

        next.style.display =
            "inline-block";

    }

}


// ======================================
// 結束加入
// ======================================

window.closeJoining =
async function() {

    if (
        !isHost
    ) {

        return;

    }


    const active =
        Object.values(
            roomData.players ||
            {}
        )
        .filter(
            p =>
                p.status ===
                "active"
        );


    if (
        active.length <
        2
    ) {

        alert(
            "至少需要 2 位參賽者"
        );


        return;

    }


    await runTransaction(

        db,

        async transaction => {


            const snap =
                await transaction.get(
                    roomRef
                );


            transaction.update(

                roomRef,

                {

                    joinOpen:
                        false

                }

            );

        }

    );

};


// ======================================
// 開始一般輪
// ======================================

window.startRound =
async function() {

    if (
        !isHost
    ) {

        return;

    }


    await runTransaction(

        db,

        async transaction => {


            const snap =
                await transaction.get(
                    roomRef
                );


            const data =
                snap.data();


            if (
                data.joinOpen !==
                false
            ) {

                throw new Error(
                    "請先結束加入"
                );

            }


            transaction.update(

                roomRef,

                {

                    roundStatus:
                        "playing"

                }

            );

        }

    );

};


// ======================================
// 玩家出拳
// ======================================

window.choose =
async function(
    choice
) {

    if (
        isHost
    ) {

        return;

    }


    try {

        await runTransaction(

            db,

            async transaction => {


                const snap =
                    await transaction.get(
                        roomRef
                    );


                const data =
                    snap.data();


                const players = {
                    ...(data.players || {})
                };


                const me =
                    players[
                        playerId
                    ];


                if (
                    !me ||
                    me.status !==
                    "active"
                ) {

                    throw new Error(
                        "你目前不能參賽"
                    );

                }


                if (
                    data.stage ===
                    "group"
                ) {

                    if (
                        data.roundStatus !==
                        "groupPlaying" ||
                        data.activeGroup !==
                        me.group
                    ) {

                        throw new Error(
                            "目前不是你的組別"
                        );

                    }

                }

                else {

                    if (
                        data.roundStatus !==
                        "playing"
                    ) {

                        throw new Error(
                            "本輪尚未開始"
                        );

                    }

                }


                if (
                    me.ready
                ) {

                    return;

                }


                players[
                    playerId
                ] = {

                    ...me,

                    choice:
                        choice,

                    ready:
                        true

                };


                transaction.update(

                    roomRef,

                    {

                        players:
                            players

                    }

                );

            }

        );

    }

    catch(error) {

        alert(
            error.message
        );

    }

};

window.endRound =
async function() {

    if (
        !isHost
    ) {

        return;

    }


    try {

        await runTransaction(

            db,

            async transaction => {


                const snap =
                    await transaction.get(
                        roomRef
                    );


                const data =
                    snap.data();


                const players = {
                    ...(data.players || {})
                };


                const activeEntries =
                    Object.entries(
                        players
                    )
                    .filter(
                        (
                            [
                                id,
                                p
                            ]
                        ) =>
                            p.status ===
                            "active"
                    );


                const ready =
                    activeEntries
                    .filter(
                        (
                            [
                                id,
                                p
                            ]
                        ) =>
                            p.ready
                    );


                if (
                    ready.length <
                    2
                ) {

                    throw new Error(
                        "至少需要 2 位玩家出拳"
                    );

                }


                // 沒出拳者在截止時淘汰
                activeEntries.forEach(

                    (
                        [
                            id,
                            p
                        ]
                    ) => {

                        if (
                            !p.ready
                        ) {

                            players[
                                id
                            ] = {

                                ...p,

                                status:
                                    "spectator",

                                eliminatedReason:
                                    "未出拳"

                            };

                        }

                    }

                );


                // 第一輪先交給房主選擇是否分組
                if (
                    (
                        data.round ||
                        1
                    ) ===
                    1 &&
                    !data.firstRoundDecision
                ) {

                    ready.forEach(

                        (
                            [
                                id,
                                p
                            ]
                        ) => {

                            players[
                                id
                            ] = {

                                ...players[id],

                                group:
                                    p.choice

                            };

                        }

                    );


                    transaction.update(

                        roomRef,

                        {

                            players:
                                players,

                            roundStatus:
                                "firstDecision"

                        }

                    );


                    return;

                }


                applyNormalElimination(
                    players
                );


                transaction.update(

                    roomRef,

                    {

                        players:
                            players,

                        roundStatus:
                            "ended"

                    }

                );

            }

        );

    }

    catch(error) {

        alert(
            error.message
        );

    }

};


// ======================================
// 一般淘汰判定
// ======================================

function applyNormalElimination(
    players
) {

    const participants =
        Object.entries(
            players
        )
        .filter(
            (
                [
                    id,
                    p
                ]
            ) =>
                p.status ===
                "active" &&
                p.ready
        );


    const choices =
        [
            ...new Set(
                participants.map(
                    (
                        [
                            id,
                            p
                        ]
                    ) =>
                        p.choice
                )
            )
        ];


    if (
        choices.length !==
        2
    ) {

        return;

    }


    const winner =
        getWinningChoice(
            choices
        );


    participants.forEach(

        (
            [
                id,
                p
            ]
        ) => {

            if (
                p.choice !==
                winner
            ) {

                players[
                    id
                ] = {

                    ...p,

                    status:
                        "spectator"

                };

            }

        }

    );

}

    ]
    .forEach(
        group => {


            const members =
                Object.values(

                )
                .filter(
                    p =>
                        p.status ===
                        "active" &&
                        p.group ===
                        group
                );


            const box =

                .createElement(

                );


            box.className =

                document
                .createElement(
                    "div"
                );


            title.className =
                "group-title";


            title.innerText =
                groupNames[
                    group
                ] +
                "　" +
                members.length +
                " 人";

                title
            );


            const status =
                statuses[
                    group
                ] ||

                document
                .createElement(

                );

            }

            else if (
                status ===
                "playing"
            ) {

                text.innerText =

            }

            else if (
                status ===
                "replay"
            ) {

                text.innerText =

            }

            else {

                text.innerText =
                    "⏳ 等待房主安排";

            if (
                (
                    status ===

                    status ===

                ) &&
                !roomData.activeGroup
            ) {

                const button =
                    document
                    .createElement(
                        "button"
                    );


                button.className =
                    "group-btn";


                button.innerText =
                    status ===

                button.onclick =
                    () =>
                        startGroup(
                            group
                        );


                box.appendChild(
                    button
                );

            }


            if (
                status ===
                "playing" &&
                roomData.activeGroup ===
                group
            ) {

                const button =
                    document
                    .createElement(
                        "button"
                    );


                button.className =
                    "end-round-btn";


                button.innerText =
                    "🛑 結束本組比賽";


                button.onclick =
                    () =>
                        endGroup(
                            group
                        );


                box.appendChild(
                    button
                );

            }


            list.appendChild(
                box
            );

        }
    );


    const allDone =
        [
            "rock",
            "scissors",
            "paper"
        ]
        .every(
            group => {

                const status =
                    statuses[
                        group
                    ];


                return (
                    status ===
                    "completed" ||
                    status ===
                    "empty"
                );

            }
        );


    document
    .getElementById(
        "finishGroupsBtn"
    )
    .style.display =
        allDone
        ? "inline-block"
        : "none";

}

// ======================================
// 勝負拳
// ======================================

function getWinningChoice(
    choices
) {

    if (
        choices.includes(
            "rock"
        ) &&
        choices.includes(
            "scissors"
        )
    ) {

        return "rock";

    }


    if (
        choices.includes(
            "scissors"
        ) &&
        choices.includes(
            "paper"
        )
    ) {

        return "scissors";

    }


    return "paper";

}

    const active =

    const total =

    );

        );

function renderChat(
    messages
) {

    const box =
        document
        .getElementById(
            "chatMessages"
        );


    box.innerHTML =
        "";


    if (
        messages.length ===
        0
    ) {

        box.innerHTML =
            "<div class='hint'>尚無訊息</div>";


        return;

    }


    messages.forEach(
        message => {


            const wrapper =
                document
                .createElement(
                    "div"
                );


            wrapper.className =
                "chat-message";


            const name =
                document
                .createElement(
                    "div"
                );


            name.className =
                "chat-name";


            name.innerText =
                message.role ===
                "host"
                ? "👑 " +
                  (
                    message.nickname ||
                    "房主"
                  )
                : (
                    message.nickname ||
                    "匿名玩家"
                  );


            const text =
                document
                .createElement(
                    "div"
                );


            text.className =
                "chat-text";


            text.innerText =
                message.text ||
                "";


            wrapper.appendChild(
                name
            );


            wrapper.appendChild(
                text
            );


            box.appendChild(
                wrapper
            );

        }
    );


    box.scrollTop =
        box.scrollHeight;

            role:
                isHost
                ? "host"
                : "player",

            text:
                text,

            createdAt:
                serverTimestamp()

        }

    );


    input.value =
        "";


    updateChatCount();

};


// ======================================
// Enter 發送
// ======================================

document
.getElementById(
    "chatInput"
)
.addEventListener(

    "keydown",

    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();


            window.sendMessage();

        }

    }

);


// ======================================
// 字數
// ======================================

function updateChatCount() {

    const input =
        document
        .getElementById(
            "chatInput"
        );


    document
    .getElementById(
        "chatCount"
    )
    .innerText =
        input.value.length +
        " / 100";

}


document
.getElementById(
    "chatInput"
)
.addEventListener(
    "input",
    updateChatCount
);

</script>

</body>

</html>
