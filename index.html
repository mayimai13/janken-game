<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜拳遊戲</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .choice {
            width: 100px;
            height: 120px;
            border: none;
            border-radius: 20px;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            font-size: 50px;
        }

        .choice:hover {
            transform: scale(1.05);
        }

        .choice:active {
            transform: scale(0.95);
        }

        #result {
            margin-top: 40px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎮 猜拳遊戲</h1>

        <div class="subtitle">
            請選擇你的出拳
        </div>

        <div class="choices">

            <button class="choice" onclick="choose('rock')">
                ✊
            </button>

            <button class="choice" onclick="choose('scissors')">
                ✌️
            </button>

            <button class="choice" onclick="choose('paper')">
                🖐️
            </button>

        </div>

        <div id="result">
            等待出拳...
        </div>

    </div>

    <script>

        function choose(choice) {

            let text = "";

            if (choice === "rock") {
                text = "你出了 ✊ 石頭";
            }

            if (choice === "scissors") {
                text = "你出了 ✌️ 剪刀";
            }

            if (choice === "paper") {
                text = "你出了 🖐️ 布";
            }

            document.getElementById("result").innerText = text;
        }

    </script>

</body>
</html>
