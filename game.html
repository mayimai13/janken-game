<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匿名猜拳淘汰賽</title>
  <style>
    body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f5f5f5;text-align:center;color:#222}
    .container{max-width:600px;margin:auto;padding:25px 18px 60px}
    .card{background:#fff;border-radius:20px;padding:24px;margin-top:18px;box-shadow:0 4px 16px rgba(0,0,0,.10)}
    .room-number{font-size:32px;font-weight:bold;letter-spacing:5px;margin:8px}
    .round{font-size:20px;font-weight:bold;margin-top:15px}.round-state{margin-top:10px;font-weight:bold}
    button{border:0;border-radius:12px;padding:13px 20px;margin:7px;font-size:16px;cursor:pointer;color:#fff}
    button:disabled{opacity:.5;cursor:not-allowed}
    .share-btn{background:#1687ff}.help-btn{background:#555}.close-join-btn{background:#ff9800}
    .start-btn{background:#06c755}.end-round-btn{background:#e53935}.next-btn{background:#7b61ff}
    .group-btn{background:#7b61ff}.normal-btn{background:#555}
    .choice-area{display:flex;justify-content:center;gap:12px;margin-top:20px}
    .choice{width:95px;height:115px;background:#fff;color:#222;font-size:48px;box-shadow:0 3px 12px rgba(0,0,0,.15)}
    .player-list{text-align:left}.player{padding:12px 5px;border-bottom:1px solid #eee}.spectator{color:#999}.temp-watch{color:#777}
    .host-box{padding:12px;background:#fff8e1;border-radius:12px;margin-bottom:15px}.hint{font-size:14px;color:#888}
    #status{margin-top:15px;color:#666}#result{line-height:1.8;margin-top:20px}
    #hostControls,#groupDecisionArea,#groupControlArea{display:none}
    #startRoundBtn,#endRoundBtn,#nextRoundBtn{display:none}
    #watchMessage{display:none;background:#fafafa;padding:18px;margin-top:15px;border-radius:12px}
    #winnerArea{display:none}.winner{font-size:30px;font-weight:bold}
    .mode-panel{display:none;margin:14px 0;padding:16px;background:#f8f8f8;border-radius:14px}
    .mode-options{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
    .mode-option{background:#fff;color:#222;border:2px solid #ddd;min-width:160px}
    .mode-option.selected{border-color:#06c755;background:#effff4}
    .mode-label{margin-top:10px;padding:10px;background:#fff8e1;border-radius:10px;font-weight:bold}
    .group-box{padding:14px;margin:10px 0;background:#fafafa;border-radius:12px;text-align:left}
    .group-title{font-size:18px;font-weight:bold}.group-status{color:#777;font-size:14px;margin-top:4px}
    .chat-card{text-align:left}.chat-title{text-align:center}
    #chatMessages{height:300px;overflow-y:auto;background:#fafafa;border-radius:12px;border:1px solid #eee;padding:10px}
    .chat-message{padding:9px 11px;background:#fff;border-radius:10px;margin-bottom:10px}
    .chat-name{font-weight:bold;font-size:14px}.chat-text{margin-top:4px;word-break:break-word}
    .chat-input-area{display:flex;gap:8px;margin-top:10px}
    #chatInput{flex:1;min-width:0;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px}
    .chat-send{background:#1687ff;margin:0}#chatCount{text-align:right;font-size:12px;color:#999;margin-top:4px}
  </style>
</head>
<body>
<div class="container">
  <h1>🎮 匿名猜拳淘汰賽</h1>

  <div class="card">
    <div>房間號碼</div>
    <div id="roomNumber" class="room-number"></div>
    <div id="roundNumber" class="round"></div>
    <div id="roundState" class="round-state">🟢 等待參賽者加入</div>
    <div id="modeDisplay" class="mode-label">🎯 淘汰規則：尚未選擇</div>
    <button class="share-btn" onclick="copyInviteLink()">📋 複製邀請連結</button>
    <button class="help-btn" onclick="location.href='help.html'">❓ 使用說明</button>
    <div id="copyMessage"></div>
    <div id="joinStatus">🟢 開放加入</div>
  </div>

  <div class="card">
    <div id="hostBox" class="host-box"></div>
    <h2>👥 參賽玩家</h2>
    <div id="playerList" class="player-list"></div>
    <div id="status">等待玩家...</div>
  </div>

  <div class="card">
    <h2 id="gameTitle">🟢 等待其他參賽者加入</h2>
    <div class="choice-area">
      <button class="choice" onclick="choose('rock')">✊</button>
      <button class="choice" onclick="choose('scissors')">✌️</button>
      <button class="choice" onclick="choose('paper')">🖐️</button>
    </div>

    <div id="watchMessage">👀 目前為觀賽模式</div>
    <div id="result"></div>

    <div id="hostControls">
      <div class="hint">👑 房主控制</div>

      <button id="closeJoinBtn" class="close-join-btn" onclick="closeJoining()">🔒 結束加入</button>

      <div id="modePanel" class="mode-panel">
        <strong>🎯 請選擇這一場淘汰賽的規則</strong>
        <div class="mode-options">
          <button id="winnerModeBtn" class="mode-option" onclick="selectTournamentMode('winner')">🏆 贏的人晉級</button>
          <button id="loserModeBtn" class="mode-option" onclick="selectTournamentMode('loser')">😈 輸的人晉級</button>
        </div>
        <div class="hint">按下「開始淘汰賽」後規則就會鎖定，不能中途更改。</div>
      </div>

      <button id="startRoundBtn" class="start-btn" onclick="startRound()">▶️ 開始淘汰賽</button>
      <button id="endRoundBtn" class="end-round-btn" onclick="endRound()">🛑 結束本輪</button>
      <button id="nextRoundBtn" class="next-btn" onclick="prepareNextRound()">🔄 準備下一輪</button>
    </div>
  </div>

  <div id="groupDecisionArea" class="card">
    <h2>📊 第一輪完成</h2>
    <p>房主要如何進行下一階段？</p>
    <div id="firstRoundGroupSummary"></div>
    <button class="group-btn" onclick="enableGroupMode()">👥 依第一輪出拳分組</button>
    <button class="normal-btn" onclick="continueWithoutGroups()">➡️ 不分組，直接判定</button>
  </div>

  <div id="groupControlArea" class="card">
    <h2>👥 分組淘汰</h2>
    <p class="hint">房主可自行決定哪一組先進行；所有組別沿用本場淘汰規則。</p>
    <div id="groupList"></div>
    <button id="finishGroupsBtn" class="next-btn" style="display:none" onclick="finishGroupStage()">✅ 分組比賽完成，進入下一輪</button>
  </div>

  <div id="winnerArea" class="card">
    <h2>🎉 比賽結束</h2>
    <div id="finalWinner" class="winner"></div>
  </div>

  <div class="card chat-card">
    <h2 class="chat-title">💬 房間討論區</h2>
    <div id="chatMessages"></div>
    <div class="chat-input-area">
      <input id="chatInput" maxlength="100" placeholder="輸入訊息...">
      <button class="chat-send" onclick="sendMessage()">送出</button>
    </div>
    <div id="chatCount">0 / 100</div>
  </div>
</div>

<script type="module" src="./js/game.js"></script>
</body>
</html>
