<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>匿名猜拳淘汰賽</title>

<style>
body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f5f5f5;
    text-align: center;
    color: #222;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 30px 18px 60px;
}

h1 {
    font-size: 34px;
    margin-bottom: 5px;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    margin-top: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,.10);
}

input {
    box-sizing: border-box;
    width: 90%;
    max-width: 320px;
    padding: 14px;
    margin: 8px 0;
    font-size: 18px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 12px;
}

button {
    padding: 13px 22px;
    margin: 8px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    cursor: pointer;
    color: white;
    background: #06c755;
}

.join-btn {
    background: #1687ff;
}

.hint {
    color: #888;
    font-size: 14px;
    line-height: 1.6;
}

.room-number {
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 5px;
    margin: 15px;
}

#inviteArea,
#closedArea {
    display: none;
}

.closed-icon {
    font-size: 55px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 匿名猜拳</h1>

<div class="subtitle">
淘汰制猜拳大賽
</div>


<!-- 建立遊戲 -->

<div id="createArea" class="card">

<h2>👑 建立猜拳遊戲</h2>

<input
    id="hostNickname"
    maxlength="12"
    placeholder="輸入你的匿名暱稱"
>

<p class="hint">
建立遊戲的人會成為房主
</p>

<button onclick="createRoom()">
🎮 建立遊戲
</button>

</div>


<!-- 邀請玩家 -->

<div id="inviteArea" class="card">

<h2>🎟️ 加入猜拳遊戲</h2>

<div>房間號碼</div>

<div
    id="inviteRoomNumber"
    class="room-number">
</div>

<input
    id="playerNickname"
    maxlength="12"
    placeholder="輸入你的匿名暱稱"
>

<p class="hint">
輸入匿名暱稱即可參賽
</p>

<button
    class="join-btn"
    onclick="joinRoom()">
🚪 加入遊戲
</button>

</div>


<!-- 已停止加入 -->

<div id="closedArea" class="card">

<div class="closed-icon">
🔒
</div>

<h2>此房間已停止加入</h2>

<p>
房主已經關閉新玩家加入。
</p>

<p class="hint">
已經在房間裡的玩家仍可繼續進行比賽。
</p>

</div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    runTransaction,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBgIL1m6WvO9H23EJ1RUxd_gzAiVnnnWEo",

    authDomain:
    "janken-game-69aa6.firebaseapp.com",

    projectId:
    "janken-game-69aa6",

    storageBucket:
    "janken-game-69aa6.firebasestorage.app",

    messagingSenderId:
    "676529713314",

    appId:
    "1:676529713314:web:3e127ae463d68a250a27fb",

    measurementId:
    "G-BK85KK19FG"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


// ==========================================
// 匿名玩家 ID
// ==========================================

function getPlayerId() {

    let id =
        sessionStorage.getItem(
            "jankenPlayerId"
        );

    if (!id) {

        if (crypto.randomUUID) {

            id =
                "p_" +
                crypto.randomUUID();

        } else {

            id =
                "p_" +
                Date.now() +
                "_" +
                Math.random()
                .toString(36)
                .substring(2);
        }

        sessionStorage.setItem(
            "jankenPlayerId",
            id
        );
    }

    return id;
}


const playerId =
    getPlayerId();


// ==========================================
// 邀請房號
// ==========================================

const params =
    new URLSearchParams(
        window.location.search
    );

const invitedRoom =
    params.get("room");


// ==========================================
// 初始化邀請頁
// ==========================================

async function initializePage() {

    if (
        !invitedRoom ||
        !/^\d{4}$/.test(invitedRoom)
    ) {
        return;
    }


    try {

        const roomRef =
            doc(
                db,
                "rooms",
                invitedRoom
            );


        const roomSnap =
            await getDoc(
                roomRef
            );


        document
        .getElementById("createArea")
        .style.display =
            "none";


        if (!roomSnap.exists()) {

            showClosed(
                "找不到這個房間"
            );

            return;
        }


        const data =
            roomSnap.data();


        if (
            data.status === "finished"
        ) {

            showClosed(
                "這場比賽已經結束"
            );

            return;
        }


        if (
            data.joinOpen === false
        ) {

            showClosed(
                "房主已經關閉新玩家加入"
            );

            return;
        }


        document
        .getElementById("inviteArea")
        .style.display =
            "block";


        document
        .getElementById("inviteRoomNumber")
        .innerText =
            invitedRoom;

    }

    catch(error) {

        console.error(error);

        showClosed(
            "讀取房間失敗"
        );
    }
}


// ==========================================
// 關閉畫面
// ==========================================

function showClosed(text) {

    document
    .getElementById("createArea")
    .style.display =
        "none";


    document
    .getElementById("inviteArea")
    .style.display =
        "none";


    document
    .getElementById("closedArea")
    .style.display =
        "block";


    document
    .querySelector("#closedArea p")
    .innerText =
        text;
}


// ==========================================
// 房號
// ==========================================

function generateRoomCode() {

    return Math.floor(
        1000 +
        Math.random() * 9000
    ).toString();
}


// ==========================================
// 建立遊戲
// ==========================================

window.createRoom =
async function() {

    const nickname =
        document
        .getElementById("hostNickname")
        .value
        .trim();

    if (!nickname) {

        alert(
            "請輸入匿名暱稱"
        );

        return;
    }


    try {

        let roomCode =
            generateRoomCode();

        let roomRef =
            doc(
                db,
                "rooms",
                roomCode
            );

        let roomSnap =
            await getDoc(
                roomRef
            );


        while (
            roomSnap.exists()
        ) {

            roomCode =
                generateRoomCode();

            roomRef =
                doc(
                    db,
                    "rooms",
                    roomCode
                );

            roomSnap =
                await getDoc(
                    roomRef
                );
        }


        await setDoc(
            roomRef,
            {

                hostId:
                    playerId,

                status:
                    "playing",

                joinOpen:
                    true,

                round:
                    1,

                roundStatus:
                    "playing",

                createdAt:
                    serverTimestamp(),

                players: {

                    [playerId]: {

                        nickname:
                            nickname,

                        status:
                            "active",

                        choice:
                            null,

                        ready:
                            false
                    }
                }
            }
        );


        sessionStorage.setItem(
            "jankenNickname",
            nickname
        );

        sessionStorage.setItem(
            "jankenRoom",
            roomCode
        );


        window.location.href =
            "game.html?room=" +
            roomCode;

    }

    catch(error) {

        console.error(error);

        alert(
            "建立遊戲失敗：" +
            error.message
        );
    }
};


// ==========================================
// 加入遊戲
// ==========================================

window.joinRoom =
async function() {

    const nickname =
        document
        .getElementById("playerNickname")
        .value
        .trim();

    if (!nickname) {

        alert(
            "請輸入匿名暱稱"
        );

        return;
    }


    if (!invitedRoom) {

        alert(
            "沒有房間號碼"
        );

        return;
    }


    const roomRef =
        doc(
            db,
            "rooms",
            invitedRoom
        );


    try {

        await runTransaction(
            db,
            async transaction => {

                const snapshot =
                    await transaction.get(
                        roomRef
                    );


                if (!snapshot.exists()) {

                    throw new Error(
                        "找不到這個遊戲"
                    );
                }


                const data =
                    snapshot.data();


                if (
                    data.status ===
                    "finished"
                ) {

                    throw new Error(
                        "這場遊戲已經結束"
                    );
                }


                const players = {
                    ...(data.players || {})
                };


                // 已經加入過的玩家可以回來
                const alreadyJoined =
                    !!players[playerId];


                if (
                    data.joinOpen === false &&
                    !alreadyJoined
                ) {

                    throw new Error(
                        "此房間已停止加入"
                    );
                }


                players[playerId] = {

                    nickname:
                        nickname,

                    status:
                        alreadyJoined
                        ? players[playerId].status
                        : "active",

                    choice:
                        alreadyJoined
                        ? players[playerId].choice
                        : null,

                    ready:
                        alreadyJoined
                        ? players[playerId].ready
                        : false
                };


                transaction.update(
                    roomRef,
                    {
                        players:
                            players
                    }
                );
            }
        );


        sessionStorage.setItem(
            "jankenNickname",
            nickname
        );

        sessionStorage.setItem(
            "jankenRoom",
            invitedRoom
        );


        window.location.href =
            "game.html?room=" +
            invitedRoom;

    }

    catch(error) {

        console.error(error);

        alert(
            error.message
        );
    }
};


initializePage();

</script>

</body>
</html>
