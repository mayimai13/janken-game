<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猜拳大賽</title>
  <style>
    body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f5f5f5;text-align:center;color:#222}
    .container{max-width:520px;margin:auto;padding:30px 18px 60px}
    h1{font-size:34px;margin-bottom:5px}
    .subtitle{color:#777;margin-bottom:25px}
    .card{background:#fff;border-radius:20px;padding:25px;margin-top:20px;box-shadow:0 4px 16px rgba(0,0,0,.10)}
    input{box-sizing:border-box;width:90%;max-width:320px;padding:14px;margin:8px 0;font-size:18px;text-align:center;border:1px solid #ccc;border-radius:12px}
    button{padding:13px 22px;margin:8px;border:0;border-radius:12px;font-size:17px;cursor:pointer;color:#fff;background:#06c755}
    .join-btn{background:#1687ff}.help-btn{background:#555}
    .hint{color:#888;font-size:14px;line-height:1.6}
    .room-number{font-size:34px;font-weight:bold;letter-spacing:5px;margin:15px}
    #inviteArea,#closedArea{display:none}.closed-icon{font-size:55px}
  </style>
</head>
<body>
<div class="container">
  <h1>🎮 匿名猜拳</h1>
  <div class="subtitle">多人淘汰制猜拳</div>

  <div id="createArea" class="card">
    <h2>👑 建立猜拳遊戲</h2>
    <input id="hostNickname" maxlength="12" placeholder="輸入房主暱稱">
    <p class="hint">房主只負責主持，不參與猜拳</p>
    <button onclick="createRoom()">🎮 建立遊戲</button>
    <button class="help-btn" onclick="location.href='help.html'">❓ 使用說明</button>
  </div>

  <div id="inviteArea" class="card">
    <h2>🎟️ 加入猜拳遊戲</h2>
    <div>房間號碼</div>
    <div id="inviteRoomNumber" class="room-number"></div>
    <input id="playerNickname" maxlength="12" placeholder="輸入匿名暱稱">
    <p class="hint">輸入匿名暱稱即可加入</p>
    <button class="join-btn" onclick="joinRoom()">🚪 加入遊戲</button>
    <button class="help-btn" onclick="location.href='help.html'">❓ 使用說明</button>
  </div>

  <div id="closedArea" class="card">
    <div class="closed-icon">🔒</div>
    <h2>目前無法加入</h2>
    <p id="closedText">此房間已停止加入</p>
    <button class="help-btn" onclick="location.href='help.html'">❓ 使用說明</button>
  </div>
</div>

<script type="module" src="./js/index.js"></script>
</body>
</html>
