<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>匿名猜拳淘汰賽</title>


<style>

body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f5f5f5;
    text-align: center;
    color: #222;
}

.container {
    max-width: 560px;
    margin: auto;
    padding: 25px 18px 60px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 24px;
    margin-top: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,.10);
}

.room-number {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 5px;
    margin: 8px;
}

.round {
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 20px;
    margin: 7px;
    font-size: 17px;
    cursor: pointer;
    color: white;
}

.share-btn {
    background: #1687ff;
}

.close-join-btn {
    background: #ff9800;
}

.closed-join-btn {
    background: #888;
    cursor: default;
}

.end-round-btn {
    background: #e53935;
}

.next-btn {
    background: #06c755;
}

.choice-area {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
}

.choice {
    width: 95px;
    height: 115px;
    background: white;
    color: #222;
    font-size: 48px;
    box-shadow: 0 3px 12px rgba(0,0,0,.15);
}

.choice:disabled {
    opacity: .3;
    cursor: not-allowed;
}

.player-list {
    text-align: left;
}

.player {
    padding: 12px 5px;
    border-bottom: 1px solid #eee;
}

.spectator {
    color: #999;
}

#hostControls {
    display: none;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #eee;
}

#nextRoundBtn {
    display: none;
}

#spectatorMessage {
    display: none;
    padding: 18px;
    margin-top: 15px;
    background: #fafafa;
    border-radius: 12px;
    color: #777;
}

#winnerArea {
    display: none;
}

.winner {
    font-size: 30px;
    font-weight: bold;
    margin: 20px;
}

.host-box {
    padding: 12px;
    background: #fff8e1;
    border-radius: 12px;
    margin-bottom: 15px;
}

.hint {
    font-size: 14px;
    color: #888;
}

#status {
    margin-top: 15px;
    color: #666;
}

#result {
    line-height: 1.8;
    margin-top: 20px;
}

</style>

</head>


<body>

<div class="container">


<h1>🎮 匿名猜拳淘汰賽</h1>


<div class="card">

    <div>
        房間號碼
    </div>

    <div
        id="roomNumber"
        class="room-number">
    </div>

    <div
        id="roundNumber"
        class="round">
    </div>

    <button
        class="share-btn"
        onclick="copyInviteLink()">
        📋 複製邀請連結
    </button>

    <div id="copyMessage"></div>

    <div id="joinStatus">
        🟢 開放加入
    </div>

</div>


<div class="card">

    <div
        id="hostBox"
        class="host-box">
    </div>

    <h2>👥 參賽玩家</h2>

    <div
        id="playerList"
        class="player-list">
    </div>

    <div id="status">
        等待玩家...
    </div>

</div>


<div
    id="gameArea"
    class="card">

    <h2 id="gameTitle">
        請選擇你的出拳
    </h2>


    <div class="choice-area">

        <button
            class="choice"
            onclick="choose('rock')">
            ✊
        </button>

        <button
            class="choice"
            onclick="choose('scissors')">
            ✌️
        </button>

        <button
            class="choice"
            onclick="choose('paper')">
            🖐️
        </button>

    </div>


    <div id="spectatorMessage">

        👀 你已被淘汰

        <br><br>

        現在進入觀看模式

    </div>


    <div id="result"></div>


    <div id="hostControls">

        <div class="hint">
            👑 房主控制
        </div>


        <button
            id="closeJoinBtn"
            class="close-join-btn"
            onclick="closeJoining()">

            🔒 結束加入

        </button>


        <button
            id="endRoundBtn"
            class="end-round-btn"
            onclick="endRound()">

            🛑 結束本輪

        </button>


        <button
            id="nextRoundBtn"
            class="next-btn"
            onclick="nextRound()">

            🔄 開始下一輪

        </button>

    </div>

</div>


<div
    id="winnerArea"
    class="card">

    <h2>🎉 比賽結束</h2>

    <div
        id="finalWinner"
        class="winner">
    </div>

</div>


</div>


<script type="module">


import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getFirestore,
    doc,
    onSnapshot,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyBgIL1m6WvO9H23EJ1RUxd_gzAiVnnnWEo",
    authDomain: "janken-game-69aa6.firebaseapp.com",
    projectId: "janken-game-69aa6",
    storageBucket: "janken-game-69aa6.firebasestorage.app",
    messagingSenderId: "676529713314",
    appId: "1:676529713314:web:3e127ae463d68a250a27fb",
    measurementId: "G-BK85KK19FG"
};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const playerId =
    sessionStorage.getItem(
        "jankenPlayerId"
    );


const nickname =
    sessionStorage.getItem(
        "jankenNickname"
    );


const params =
    new URLSearchParams(
        window.location.search
    );


const roomCode =
    params.get("room");


if (
    !playerId ||
    !nickname ||
    !roomCode
) {

    alert(
        "玩家資料不存在，請重新加入遊戲"
    );

    window.location.href =
        "index.html";
}


const roomRef =
    doc(
        db,
        "rooms",
        roomCode
    );


let roomData = null;
let isHost = false;


document
.getElementById("roomNumber")
.innerText =
    roomCode;


onSnapshot(

    roomRef,

    snapshot => {

        if (!snapshot.exists()) {
            return;
        }


        roomData =
            snapshot.data();


        isHost =
            roomData.hostId ===
            playerId;


        const players =
            roomData.players ||
            {};


        document
        .getElementById("hostBox")
        .innerText =
            "👑 房主：" +
            (
                roomData.hostNickname ||
                "主持人"
            );


        renderPlayers(
            players
        );


        updateJoinStatus();


        updateGame(
            players
        );


        document
        .getElementById("roundNumber")
        .innerText =
            "第 " +
            (
                roomData.round ||
                1
            ) +
            " 輪";


        document
        .getElementById("hostControls")
        .style.display =
            isHost
            ? "block"
            : "none";


        if (
            roomData.roundStatus ===
            "ended"
        ) {

            showRoundResult(
                players
            );

        } else {

            document
            .getElementById("result")
            .innerHTML = "";


            if (isHost) {

                document
                .getElementById("endRoundBtn")
                .style.display =
                    "inline-block";


                document
                .getElementById("nextRoundBtn")
                .style.display =
                    "none";
            }
        }


        checkFinalWinner(
            players
        );

    }

);


function updateJoinStatus() {

    const joinOpen =
        roomData.joinOpen !==
        false;


    document
    .getElementById("joinStatus")
    .innerText =
        joinOpen
        ? "🟢 開放加入"
        : "🔒 已停止加入";


    if (!isHost) {
        return;
    }


    const button =
        document
        .getElementById("closeJoinBtn");


    if (joinOpen) {

        button.disabled = false;
        button.innerText =
            "🔒 結束加入";
        button.className =
            "close-join-btn";

    } else {

        button.disabled = true;
        button.innerText =
            "🔒 已停止加入";
        button.className =
            "closed-join-btn";
    }
}


window.closeJoining =
async function() {

    if (!isHost) {
        return;
    }


    try {

        await runTransaction(

            db,

            async transaction => {

                const snapshot =
                    await transaction.get(
                        roomRef
                    );


                const data =
                    snapshot.data();


                if (
                    data.hostId !==
                    playerId
                ) {

                    throw new Error(
                        "只有房主可以停止加入"
                    );
                }


                transaction.update(
                    roomRef,
                    {
                        joinOpen:
                            false
                    }
                );
            }
        );

    }

    catch(error) {

        alert(
            error.message
        );
    }
};


function renderPlayers(
    players
) {

    const list =
        document
        .getElementById("playerList");


    list.innerHTML = "";


    const entries =
        Object.entries(players);


    if (
        entries.length === 0
    ) {

        list.innerHTML =
            "<div class='player'>目前還沒有參賽玩家</div>";

        return;
    }


    entries.forEach(
        ([id, player]) => {

            const row =
                document
                .createElement("div");


            row.className =
                "player";


            let text =
                player.nickname;


            if (
                id === playerId
            ) {

                text +=
                    "（你）";
            }


            if (
                player.status ===
                "spectator"
            ) {

                row.classList.add(
                    "spectator"
                );

                text +=
                    "　👀 觀看中";

            } else {

                text +=
                    player.ready
                    ? "　✅ 已出拳"
                    : "　⏳ 尚未出拳";
            }


            row.innerText =
                text;


            list.appendChild(
                row
            );
        }
    );
}


function updateGame(
    players
) {

    const choiceArea =
        document
        .querySelector(
            ".choice-area"
        );


    if (isHost) {

        choiceArea.style.display =
            "none";


        document
        .getElementById("gameTitle")
        .innerText =
            "👑 房主主持模式";


        document
        .getElementById("spectatorMessage")
        .style.display =
            "none";

    } else {

        choiceArea.style.display =
            "flex";


        document
        .getElementById("gameTitle")
        .innerText =
            "請選擇你的出拳";


        const me =
            players[
                playerId
            ];


        if (!me) {

            choiceArea.style.display =
                "none";

            return;
        }


        const buttons =
            document
            .querySelectorAll(
                ".choice"
            );


        if (
            me.status ===
            "spectator"
        ) {

            buttons.forEach(
                button =>
                    button.disabled =
                        true
            );


            document
            .getElementById("spectatorMessage")
            .style.display =
                "block";

        } else {

            document
            .getElementById("spectatorMessage")
            .style.display =
                "none";


            buttons.forEach(
                button => {

                    button.disabled =
                        me.ready ||
                        roomData.roundStatus ===
                        "ended";

                }
            );
        }
    }


    const activePlayers =
        Object.values(
            players
        )
        .filter(
            player =>
                player.status ===
                "active"
        );


    const readyPlayers =
        activePlayers
        .filter(
            player =>
                player.ready
        );


    document
    .getElementById("status")
    .innerText =
        "本輪已有 " +
        readyPlayers.length +
        " / " +
        activePlayers.length +
        " 位參賽者出拳";
}


window.choose =
async function(choice) {

    if (isHost) {
        return;
    }


    try {

        await runTransaction(

            db,

            async transaction => {

                const snapshot =
                    await transaction.get(
                        roomRef
                    );


                const data =
                    snapshot.data();


                const players = {
                    ...(data.players || {})
                };


                const me =
                    players[
                        playerId
                    ];


                if (
                    !me ||
                    me.status !==
                    "active"
                ) {

                    throw new Error(
                        "你目前不能參賽"
                    );
                }


                if (
                    data.roundStatus ===
                    "ended"
                ) {

                    return;
                }


                players[
                    playerId
                ] = {

                    ...me,

                    choice:
                        choice,

                    ready:
                        true
                };


                transaction.update(
                    roomRef,
                    {
                        players:
                            players
                    }
                );
            }
        );

    }

    catch(error) {

        alert(
            error.message
        );
    }
};


window.endRound =
async function() {

    if (!isHost) {
        return;
    }


    try {

        await runTransaction(

            db,

            async transaction => {

                const snapshot =
                    await transaction.get(
                        roomRef
                    );


                const data =
                    snapshot.data();


                const players = {
                    ...(data.players || {})
                };


                const participants =
                    Object.entries(players)
                    .filter(
                        ([id, player]) =>
                            player.status ===
                            "active" &&
                            player.ready
                    );


                if (
                    participants.length <
                    2
                ) {

                    throw new Error(
                        "至少需要 2 位參賽者出拳"
                    );
                }


                const choices =
                    [
                        ...new Set(
                            participants.map(
                                ([id, player]) =>
                                    player.choice
                            )
                        )
                    ];


                if (
                    choices.length === 2
                ) {

                    let winningChoice;


                    if (
                        choices.includes("rock") &&
                        choices.includes("scissors")
                    ) {

                        winningChoice =
                            "rock";

                    }

                    else if (
                        choices.includes("scissors") &&
                        choices.includes("paper")
                    ) {

                        winningChoice =
                            "scissors";

                    }

                    else {

                        winningChoice =
                            "paper";
                    }


                    participants.forEach(
                        ([id, player]) => {

                            if (
                                player.choice !==
                                winningChoice
                            ) {

                                players[id] = {

                                    ...player,

                                    status:
                                        "spectator"
                                };
                            }
                        }
                    );
                }


                transaction.update(
                    roomRef,
                    {

                        players:
                            players,

                        roundStatus:
                            "ended"
                    }
                );
            }
        );

    }

    catch(error) {

        alert(
            error.message
        );
    }
};


function showRoundResult(
    players
) {

    const emoji = {
        rock: "✊ 石頭",
        scissors: "✌️ 剪刀",
        paper: "🖐️ 布"
    };


    let html =
        "<h3>🎊 本輪結果</h3>";


    Object.values(players)
    .forEach(
        player => {

            if (
                player.choice
            ) {

                html +=
                    escapeHtml(
                        player.nickname
                    ) +
                    "：" +
                    emoji[
                        player.choice
                    ];


                if (
                    player.status ===
                    "spectator"
                ) {

                    html +=
                        "　❌ 淘汰";

                } else {

                    html +=
                        "　✅ 晉級";
                }


                html +=
                    "<br>";
            }
        }
    );


    document
    .getElementById("result")
    .innerHTML =
        html;


    if (isHost) {

        document
        .getElementById("endRoundBtn")
        .style.display =
            "none";


        document
        .getElementById("nextRoundBtn")
        .style.display =
            "inline-block";
    }
}


window.nextRound =
async function() {

    if (!isHost) {
        return;
    }


    try {

        await runTransaction(

            db,

            async transaction => {

                const snapshot =
                    await transaction.get(
                        roomRef
                    );


                const data =
                    snapshot.data();


                const players = {
                    ...(data.players || {})
                };


                Object.keys(players)
                .forEach(
                    id => {

                        players[id] = {

                            ...players[id],

                            choice:
                                null,

                            ready:
                                false
                        };
                    }
                );


                transaction.update(
                    roomRef,
                    {

                        players:
                            players,

                        round:
                            (
                                data.round ||
                                1
                            ) + 1,

                        roundStatus:
                            "playing"
                    }
                );
            }
        );

    }

    catch(error) {

        alert(
            error.message
        );
    }
};


function checkFinalWinner(
    players
) {

    const active =
        Object.values(players)
        .filter(
            player =>
                player.status ===
                "active"
        );


    if (
        active.length === 1 &&
        Object.keys(players).length > 1
    ) {

        document
        .getElementById("winnerArea")
        .style.display =
            "block";


        document
        .getElementById("finalWinner")
        .innerText =
            "🏆 " +
            active[0].nickname +
            " 獲勝！";


        document
        .querySelectorAll(".choice")
        .forEach(
            button =>
                button.disabled =
                    true
        );


        if (isHost) {

            document
            .getElementById("nextRoundBtn")
            .style.display =
                "none";


            document
            .getElementById("endRoundBtn")
            .style.display =
                "none";
        }
    }
}


window.copyInviteLink =
async function() {

    const url =
        "https://mayimai13.github.io/janken-game/?room=" +
        roomCode;


    try {

        await navigator
        .clipboard
        .writeText(url);


        document
        .getElementById("copyMessage")
        .innerText =
            "✅ 邀請連結已複製";

    }

    catch {

        prompt(
            "請複製邀請連結",
            url
        );
    }
};


function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;
}

</script>

</body>
</html>v
